# ============================================================================
# Alembic 설정 — TASK-0143 (#15): NL→SQL 플랫폼 KB 스키마(Postgres agent_kb) 의
# versioned migration 프레임워크 도입 (additive baseline 한정).
#
# 1차 대상: Postgres `agent_kb` (런타임/KB 스키마가 PG). MySQL `agent_memory` 는
# 본 baseline 범위에서 제외 — 후속 단계에서 별도 도입 검토 (docs/MIGRATIONS.md 참조).
#
# sqlalchemy.url 은 본 파일에 두지 않는다. env.py 가 .env 의 AGENT_KB_PG_*
# 환경변수에서 런타임 조립한다 (자격증명 commit 금지). offline `--sql` 모드도
# env.py 가 동일 변수로 URL 을 만들어 동작한다.
# ============================================================================
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

# revision 파일명: <date>_<rev>_<slug>.py — 시간순 정렬 + 가독성.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# 타임존: 파일 헤더의 create_date 표기에만 사용.
# timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
