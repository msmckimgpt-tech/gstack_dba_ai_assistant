name: 버그 수정
description: 재현 가능한 문제와 기대 동작을 기준으로 Codex 작업을 정의합니다.
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: goal_background
    attributes:
      label: 문제 / 배경
      description: 현재 어떤 문제가 발생하는지, 왜 중요한지 적어주세요.
      placeholder: |
        - 현재 문제:
        - 영향 범위:
        - 최근 관련 변경:
    validations:
      required: true
  - type: input
    id: target_scope
    attributes:
      label: 대상 feature 또는 경로
      description: 가능한 한 `unit/<feature-id>` 또는 파일/디렉토리 경로로 적어주세요.
      placeholder: "예: unit/feature-0003-agent-web-ui/src/app.py"
    validations:
      required: true
  - type: textarea
    id: reproduce_expected
    attributes:
      label: 재현 절차 / 기대 동작
      description: 재현 절차와 기대 결과를 함께 적어주세요.
      placeholder: |
        - 재현 절차:
        - 실제 결과:
        - 기대 결과:
    validations:
      required: true
  - type: textarea
    id: success_criteria
    attributes:
      label: 성공 기준
      description: 수정 완료 판정 기준을 적어주세요.
      placeholder: |
        - [ ] 같은 재현 절차에서 오류가 사라진다
        - [ ] 관련 회귀가 없다
    validations:
      required: true
  - type: textarea
    id: validation_plan
    attributes:
      label: 검증 방법
      description: 재현 명령, 회귀 확인 명령, 로그 위치를 적어주세요.
      placeholder: |
        - make start
        - make ask q="..."
        - shared/logs/... 확인
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: 제약사항
      description: 포트, 외부 의존성, 비파괴 원칙 등 반드시 지켜야 할 조건을 적어주세요.
      placeholder: |
        - 데이터 삭제 금지
        - `.env` 의미 유지
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 참고 로그 / 문서 / 이슈
      description: 관련 로그 경로, 문서, 선행 이슈를 적어주세요.
      placeholder: |
        - docs/STATUS.md
        - shared/logs/error.log
        - #34
    validations:
      required: true
