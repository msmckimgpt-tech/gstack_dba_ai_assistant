name: 기능 요청
description: 새 기능이나 구조 개선 작업을 Codex 작업 단위로 정의합니다.
title: "[Feature] "
labels:
  - feature
body:
  - type: textarea
    id: goal_background
    attributes:
      label: 목표 / 배경
      description: 왜 필요한지와 기대하는 결과를 적어주세요.
      placeholder: |
        - 현재 문제:
        - 원하는 결과:
        - 관련 배경:
    validations:
      required: true
  - type: input
    id: target_scope
    attributes:
      label: 대상 feature 또는 경로
      description: 가능한 한 `unit/<feature-id>` 또는 파일/디렉토리 경로로 적어주세요.
      placeholder: "예: unit/feature-0002-agent-core"
    validations:
      required: true
  - type: textarea
    id: success_criteria
    attributes:
      label: 성공 기준
      description: 완료 판정을 위한 결과를 적어주세요.
      placeholder: |
        - [ ] 사용자가 보는 동작 변화
        - [ ] 내부 구조/문서 정리 기준
    validations:
      required: true
  - type: textarea
    id: validation_plan
    attributes:
      label: 검증 방법
      description: `make` 명령, 수동 시나리오, 로그 확인 기준을 적어주세요.
      placeholder: |
        - make status
        - make ask q="..."
        - 특정 로그 확인
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: 제약사항
      description: 반드시 지켜야 할 정책, 제외 범위, 성능/보안 제약을 적어주세요.
      placeholder: |
        - 외부 디렉토리 수정 금지
        - 기존 포트 유지
        - 회귀 금지 범위
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 참고 로그 / 문서 / 이슈
      description: 관련 로그 경로, 문서, 선행 이슈를 적어주세요.
      placeholder: |
        - docs/STATUS.md
        - shared/logs/...
        - #12
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Codex 작업 시 브랜치 이름은 `issue/<번호>-<short-slug>` 규칙을 사용합니다.
