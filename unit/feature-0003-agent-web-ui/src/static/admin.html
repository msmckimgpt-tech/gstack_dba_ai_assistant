<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MySQL AI Assistant Admin</title>
  <link rel="stylesheet" href="/static/styles.css?v=20260416-rbac1" />
</head>
<body class="admin-shell">
  <header class="topbar">
    <div class="topbar-brand">
      <div class="brand-icon">MA</div>
      <span class="brand-name">관리 콘솔</span>
    </div>
    <div class="topbar-end">
      <button type="button" class="topbar-btn" id="backToAppBtn">작업 화면</button>
      <button type="button" class="topbar-btn" id="adminLogoutBtn">로그아웃</button>
      <button type="button" class="btn-secondary" id="refreshAdminBtn">새로고침</button>
    </div>
  </header>

  <main class="admin-main admin-section-stack">
    <section class="surface-card admin-overview">
      <div class="section-row">
        <div>
          <div class="drawer-label">Overview</div>
          <h2>운영 상태</h2>
        </div>
      </div>
      <div class="summary-metrics">
        <article class="metric-card">
          <span>Active</span>
          <strong id="metricActive">—</strong>
        </article>
        <article class="metric-card">
          <span>Inactive</span>
          <strong id="metricInactive">—</strong>
        </article>
        <article class="metric-card">
          <span>Deleted</span>
          <strong id="metricDeleted">—</strong>
        </article>
        <article class="metric-card">
          <span>Roles</span>
          <strong id="metricRoles">—</strong>
        </article>
      </div>
    </section>

    <section class="surface-card">
      <div class="section-row">
        <div>
          <div class="drawer-label">Accounts</div>
          <h2>계정 / Override</h2>
        </div>
      </div>
      <div class="admin-toolbar">
        <input
          type="search"
          id="adminSearch"
          class="admin-search"
          placeholder="사용자 ID 검색…"
          autocomplete="off"
        />
        <div class="admin-filter-group">
          <button type="button" class="admin-filter-btn is-active" data-filter="all">전체</button>
          <button type="button" class="admin-filter-btn" data-filter="active">활성</button>
          <button type="button" class="admin-filter-btn" data-filter="inactive">비활성</button>
          <button type="button" class="admin-filter-btn" data-filter="deleted">삭제됨</button>
        </div>
      </div>
      <div class="admin-accounts" id="adminAccounts"></div>
      <div class="admin-pagination" id="adminPagination"></div>
    </section>

    <section class="surface-card">
      <div class="section-row">
        <div>
          <div class="drawer-label">Roles</div>
          <h2>역할 / 권한</h2>
        </div>
      </div>
      <form class="admin-role-create" id="roleCreateForm">
        <div class="admin-role-head">
          <label class="field">
            <span>role_key</span>
            <input type="text" name="role_key" placeholder="예: analyst" />
          </label>
          <label class="field">
            <span>표시 이름</span>
            <input type="text" name="name" placeholder="예: Analyst" />
          </label>
          <label class="field field-wide">
            <span>설명</span>
            <input type="text" name="description" placeholder="역할 용도 설명" />
          </label>
          <label class="permission-toggle">
            <input type="checkbox" name="is_active" checked />
            <span>활성</span>
          </label>
          <label class="permission-toggle">
            <input type="checkbox" name="is_default_signup" />
            <span>기본 가입 역할</span>
          </label>
          <button type="submit" class="btn-primary" id="createRoleBtn">역할 생성</button>
        </div>
        <div class="permission-grid" id="roleCreatePermissions"></div>
      </form>
      <div class="admin-accounts" id="adminRoles"></div>
    </section>
  </main>

  <div class="toast" id="adminToast"></div>

  <script src="/static/admin.js?v=20260416-rbac1"></script>
</body>
</html>
