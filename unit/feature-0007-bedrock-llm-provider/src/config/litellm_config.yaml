# LiteLLM Proxy 설정 — AWS Bedrock (Seoul region `ap-northeast-2`) 라우팅
#
# 본 파일은 bedrock-gateway 컨테이너 (docker-compose `bedrock-gateway` 서비스) 가
# `/app/config.yaml` 경로로 read-only mount 한다. backend / frontend 는 `model`
# 필드에 아래 `model_name` (alias) 만 보내고, LiteLLM 이 `litellm_params.model`
# 의 실제 Bedrock model ID 로 라우팅한다.
#
# 실 model ID 는 AWS Bedrock 의 console (Seoul region) 에서 확인 후 갱신한다.
# 아래 값은 2026-05-21 시점의 추정 schema 이며, 운영자가 batch 시점에 사실 검증
# 필요. Claude 4.x 의 정확한 versioned model ID (예: `-20250514-v1:0`) 는 AWS
# Bedrock 의 "Model access" 페이지에 표시되는 ARN 또는 invocation ID 를 그대로
# 사용한다.

model_list:
  # ── Claude Sonnet 5 (frontier, ACTIVE) — sonnet5-upgrade 2026-07-24 ──
  #    alias 는 하위호환 위해 claude-sonnet-4 로 유지하되(저장 대화·node_analysis·probe·단가·
  #    runtime_settings 키 무변경 — haiku alias 가 haiku-4-5 를 서빙하는 것과 동형), 라우팅 실 모델은
  #    현행 Sonnet 5 로 올린다. 배경: claude-sonnet-4-6 은 폐기된 버전이라 두 OAuth 계정 모두 429
  #    (rate_limit_error)를 반환 → 새 대화 sonnet 선택이 "서비스 자체의 요청량 한도"로 실패했다
  #    (haiku-4-5 는 현행이라 정상). 실 서비스 버전은 Sonnet 5 (사용자 확인 2026-07-24).
  # 2026-05-21 Phase E 검증 결과(참고 — Bedrock 배포 경로):
  # 1. Bedrock Seoul region 의 ACTIVE Sonnet/Haiku 는 on-demand 호출 미지원
  #    (inference profile 강제).
  # 2. APAC inference profile 은 LEGACY Sonnet 4 만 (30일 미사용 access denied).
  # 3. ACTIVE Sonnet 4.5 / 4.6 / Haiku 4.5 의 inference profile 은 모두
  #    `global.*` only — global cross-region routing.
  # 결정 (사용자 reanchor 2026-05-21): 사내 한정 + 비-개인정보 SQL 작업 가정으로
  # global routing 수용. 데이터 잔류 정책은 PIPA 엄격 적용 시 별 cycle 의
  # Provisioned throughput 또는 별 provider 로 재검토. ADR-0022 보강 필요.
  # Thinking: Sonnet 5 는 adaptive thinking 만 지원(budget_tokens 400). effort 는 요청 단위
  # output_config.effort(agent_core)로 조절, 미지정 시 기본 high. temperature 는 미전달(Anthropic 고정 1).
  - model_name: claude-sonnet-4
    litellm_params:
      # ── 개발 단계 (2026-06-23): claude-corp OAuth 계정(masangsoft.com)으로 Anthropic
      #    direct 호출. ANTHROPIC_API_KEY 에 OAuth access token 주입 → litellm 이
      #    sk-ant-oat 토큰을 감지해 Authorization: Bearer + oauth-2025-04-20 로 전송.
      #    배포 시 아래 Bedrock 2줄(model/aws_region_name)로 주석 토글 복구. ──
      model: anthropic/claude-sonnet-5   # sonnet5-upgrade(2026-07-24): claude-sonnet-4-6(폐기) → Sonnet 5
      # model: bedrock/global.anthropic.claude-sonnet-5   # 배포용 (Bedrock) — 복구 시 실 inference profile ID 확인
      # aws_region_name: ap-northeast-2                    # 배포용 (Bedrock)
      # sonnet5-upgrade(2026-07-24): Sonnet 5 는 budget_tokens 를 400 으로 거부한다(Anthropic 스펙 —
      # claude-api skill 확인). adaptive thinking + output_config.effort 로 전환. effort 기본 high.
      thinking:
        type: "adaptive"

  # ── Claude Haiku 4.5 (가성비, ACTIVE — global inference profile) ─────
  # Extended thinking 활성화 (budget_tokens=5000). Haiku 4.5 는 Claude 4 시리즈로
  # extended thinking 을 지원한다. thinking 활성화 시 temperature 는 1로 고정.
  - model_name: claude-haiku-4
    litellm_params:
      # 개발 단계 (2026-06-23): claude-corp OAuth → Anthropic direct. 배포 시 Bedrock 복구.
      # insight-llm-fallback(2026-07-03): 1순위 = claude-corp OAuth. deployment 별 키 분리를 위해
      # api_key 명시(두 계정 병행). 429(burst rate-limit) 시 litellm fallbacks 가 root → edge 로 즉시 우회.
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
      # model: bedrock/global.anthropic.claude-haiku-4-5-20251001-v1:0   # 배포용 (Bedrock)
      # aws_region_name: ap-northeast-2                                   # 배포용 (Bedrock)
      thinking:
        type: "enabled"
        budget_tokens: 5000

  # ── insight-llm-fallback(2026-07-03): claude-haiku-4 의 2순위 폴백 = root(개인 Max 5x) 계정 ──
  # refresh-claude-oauth-token.sh 가 root OAuth 토큰을 ANTHROPIC_API_KEY_ROOT 에 병행 주입.
  # 1순위(claude-corp)가 burst rate-limit(429)로 막혀도 root 로 즉시 우회(요청-레벨 fallback).
  - model_name: claude-haiku-4-root
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY_ROOT
      thinking:
        type: "enabled"
        budget_tokens: 5000

  # ── interactive-llm(2026-07-04, llm-routing-interactive-split): 사람이 실시간 대기하는 호출 전용 ──
  # assistant 대화(메인+보조 전 단계) + AI 능동 분석(node_analysis). insight 백그라운드 배치
  # (claude-haiku-4)와 **별도 alias** 로 분리해, 대화/분석은 주말·야간에도 항상 claude-haiku 로
  # 작동한다(사용자 결정 2026-07-04). 같은 OAuth 토큰(claude-corp/root)을 쓰되 fallback 은
  # 2계정 → edge-fallback(로컬 gemma) 최후 안전망: 정상 시 항상 claude, 두 계정 완전 장애
  # (401/429)일 때만 대화가 끊기지 않도록 gemma 로 우회. insight 의 "주말/야간 gemma 강등"은
  # litellm 이 아니라 애플리케이션(insight 함수 시간 기반 모델 선택)이 담당하므로 여기서 분리.
  - model_name: claude-haiku-4-interactive
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
      thinking:
        type: "enabled"
        budget_tokens: 5000
  - model_name: claude-haiku-4-interactive-root
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY_ROOT
      thinking:
        type: "enabled"
        budget_tokens: 5000

  # ── conversation-answer(2026-07-07, FR-edge-fallback-conversation-context-loss): 사용자 대면 assistant
  #    답변(task='agent') 전용 alias. edge(gemma) 폴백을 **의도적으로 배제** — 사용자 결정 2026-07-07:
  #    "assistant 답변에 edge/gemma 는 전혀 고려 대상이 아니며 fallback 도 구성돼선 안 된다. 명백한 실패처리로."
  #    두 claude 계정(claude-corp/root)이 모두 401/429 면 gemma 로 강등하지 않고 **429/401 을 그대로 raise** →
  #    agent_core 의 LLM-error 핸들러가 "서비스 요청량 한도… 잠시 후 다시 시도" 로 정직하게 실패(맥락 파괴한
  #    2B gemma 답변 원천 차단). insight 배치(claude-haiku-4)·분석(claude-haiku-4-interactive)의 gemma 강등은
  #    이 alias 와 무관하게 그대로 유지된다. 같은 OAuth 토큰(claude-corp/root)·thinking 설정은 대화 alias 와 동일.
  #    ※ 배경: 2026-07-04 interactive-split 은 대화를 gemma "무중단 안전망"으로 두려 했으나, 실측(conv …9e0883bb)
  #    결과 gemma(ctx 4096)가 ~30K 토큰 히스토리를 잘라 맥락을 파괴하고 자신 있게 틀린 답을 silent 로 냄 →
  #    "무중단"이 아니라 "조용한 파탄"이었다. 사용자가 대화 경로에 한해 그 결정을 override.
  - model_name: claude-haiku-4-chat
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
      thinking:
        type: "enabled"
        budget_tokens: 5000
  - model_name: claude-haiku-4-chat-root
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY_ROOT
      thinking:
        type: "enabled"
        budget_tokens: 5000

  # ── sonnet-chat-fallback(2026-07-24): claude-sonnet-4 대화 답변(task='agent') 전용 edge-free alias ──
  #    증상: 새 대화에서 사용자가 sonnet 을 고르면 "서비스 자체의 요청량 한도에 도달했습니다"로 실패(계정
  #    quota 무관). 근본 원인: bare claude-sonnet-4(위)는 **단일 계정(claude-corp)이고 root fallback 이
  #    없어**, claude-corp OAuth 가 5h rolling rate-limit(429)에 걸리면 sonnet 대화가 즉시 raise 됐다.
  #    haiku 는 claude-haiku-4-chat → -chat-root 2계정 체인으로 같은 429 를 생존한다(위). 이 비대칭을 해소:
  #    sonnet 도 -chat(claude-corp) → -chat-root(root) 2계정 체인을 부여한다. edge(gemma) 폴백은 대화 정책
  #    (2026-07-07 사용자 결정)대로 **의도적 배제** — 두 계정 모두 실패면 429/401 을 그대로 raise 해 정직하게
  #    실패한다(맥락 파괴한 2B gemma 답변 원천 차단). bare claude-sonnet-4 는 probe/OPENAI_MODEL 기본값 등
  #    비대화 경로 전용으로 무변경(격리). thinking 은 bare claude-sonnet-4 와 동일한 adaptive.
  - model_name: claude-sonnet-4-chat
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
      # sonnet5-upgrade(2026-07-24): Sonnet 5 는 budget_tokens 를 400 으로 거부한다(Anthropic 스펙 —
      # claude-api skill 확인). adaptive thinking + output_config.effort 로 전환. effort 기본 high.
      thinking:
        type: "adaptive"
  - model_name: claude-sonnet-4-chat-root
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY_ROOT
      # sonnet5-upgrade(2026-07-24): Sonnet 5 는 budget_tokens 를 400 으로 거부한다(Anthropic 스펙 —
      # claude-api skill 확인). adaptive thinking + output_config.effort 로 전환. effort 기본 high.
      thinking:
        type: "adaptive"

  # ── insight-llm-fallback: 최종(3순위) 폴백 = 로컬 gemma(edge) via local-llm-gateway ──
  # claude-corp·root 두 계정 모두 429/실패 시 로컬 LLM 으로 우회(rate-limit 없음). local-llm-gateway 는
  # OpenAI 호환 chat(gemma4:e2b) — thinking 미지원이라 litellm drop_params 가 thinking 파라미터 제거.
  # api_key 는 비밀 아님(로컬 게이트웨이) — 리터럴.
  - model_name: edge-fallback
    litellm_params:
      model: openai/gemma4:e2b
      api_base: http://local-llm-gateway:8080/v1
      api_key: "local-no-key"

  # ── KB 임베딩 alias `titan-embed` (1024-dim) — TASK-0135 (#13) ────────
  # texts.embedding(vector(1024)) + sample_queries.embedding(vector(1024)) 백필
  # + `<=>` cosine 검색용. kb_embedding_worker / kb_retrieval 이 본 alias 로
  # /v1/embeddings 호출 → LiteLLM 이 아래 provider 로 라우팅.
  # AGENT_KB_EMBEDDING_MODEL=titan-embed, AGENT_KB_EMBEDDING_DIM=1024 (.env).
  #
  # ── 현행 (2026-06-23): 로컬 Ollama bge-m3 (1024-dim) ──────────────────
  # "전환"으로 chat 은 Anthropic-direct(OAuth)로 이동했으나 Anthropic API 는
  # 임베딩 미제공 → titan-embed 만 Bedrock 에 남아 AWS 키 제거 후 401(credential
  # 부재)로 실패. 이를 Bedrock 의존 없이 로컬 Ollama bge-m3 로 대체한다.
  #   - bge-m3 = BAAI 다국어 임베딩, F16, embedding length 1024 (한국어 포함
  #     실측 dim=1024, 2026-06-23 ollama show + /api/embeddings probe 확인).
  #   - LiteLLM ollama provider 는 `model: ollama/<name>` + `api_base` 로 Ollama
  #     HTTP (/api/embeddings) 를 직접 호출한다. local-llm-gateway 는 chat 전용
  #     라우터라 /v1/embeddings 404 → gateway 우회하고 Ollama 백엔드 직접 지정.
  #   - api_base 의 ollama-edge:11434 는 `llm-shared` 네트워크 내 local-llm-edge
  #     컨테이너 alias. bedrock-gateway 가 도달하려면 docker-compose.yml 에서
  #     bedrock-gateway 서비스가 llm-shared 에 attach 돼 있어야 한다(본 cycle 에서
  #     `networks: [dbnet, llm-shared]` 로 추가).
  #
  # ── CHG-20260625: 공유 Ollama → 전용 embed-ollama 로 전환 ──────────────────
  # 공유 local-llm-edge 는 OLLAMA_MAX_LOADED_MODELS=1 이라 타 서비스 chat 모델이
  # bge-m3 를 계속 축출 → 매 임베딩이 cold 재로딩(실측 27~37s) → 준비(init) 단계
  # 2회 호출로 ~50s 회귀. 전용 embed-ollama(docker-compose `embed-ollama` 서비스,
  # dbnet)는 bge-m3 만 단독 상주(KEEP_ALIVE=-1)시켜 영구 warm(실측 0.33s). 차원
  # 동일(1024) 이라 백필/검색 호환. Bedrock Titan 복구 시 아래 토글로 되돌리고
  # embed-ollama 서비스는 비활성화한다.
  - model_name: titan-embed
    litellm_params:
      model: ollama/bge-m3
      api_base: http://embed-ollama:11434
  # ── 배포 복구용 (Bedrock Titan v2, Seoul) — AWS_* 자격 확보 후 위 3줄과 토글 ──
  # amazon.titan-embed-text-v2:0 는 Seoul region 접근 가능 확인(2026-06-02 boto3
  # probe, dim=1024). Bedrock 자격(AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY)을
  # 컨테이너 env 로 복구하면 아래 2줄로 되돌린다(차원 동일 1024 — 백필 호환).
  # - model_name: titan-embed
  #   litellm_params:
  #     model: bedrock/amazon.titan-embed-text-v2:0
  #     aws_region_name: ap-northeast-2

# ── 인증 ──────────────────────────────────────────────────────────────
# backend 가 보내는 Authorization 헤더의 Bearer token 을 BEDROCK_GATEWAY_API_KEY
# 와 대조. 일치 안 하면 401. AWS 자격증명은 컨테이너 env (AWS_ACCESS_KEY_ID /
# AWS_SECRET_ACCESS_KEY / AWS_REGION) 로만 주입되며 본 파일에 평문 미보관.
general_settings:
  master_key: os.environ/BEDROCK_GATEWAY_API_KEY

# ── 동작 ──────────────────────────────────────────────────────────────
# - drop_params: OpenAI Chat Completions 의 일부 파라미터 (예: `presence_penalty`,
#   `logit_bias`) 는 Bedrock Claude 가 지원하지 않으므로 LiteLLM 가 silently
#   drop. 본 코드 베이스의 `_openai_chat_completion_with_deadline` 호출이
#   `temperature` 만 추가하므로 drop 대상 거의 없음.
# - request_timeout: 본 backend 의 `AGENT_TIMEOUT_SEC` 와 정합. 사용자 turn 응답
#   timeout 보다 짧게 잡지 않는다.
litellm_settings:
  drop_params: true
  request_timeout: 120
  # insight-llm-fallback(2026-07-03): claude-haiku-4(claude-corp) 실패(429 rate-limit 등) 시 순서 폴백 —
  # claude-haiku-4-root(root Max 5x) → edge-fallback(로컬 gemma). insight 의 burst 호출이 한 계정의
  # RPM/TPM 을 넘겨 429 가 나도 다음 계정/로컬로 즉시 우회해 생성이 끊기지 않는다. num_retries=1 로
  # 동일 deployment 1회 재시도 후 폴백(빠른 전환). num_retries=0 이면 즉시 폴백도 가능.
  num_retries: 1
  # fallback 체인 (2026-07-04 llm-routing-interactive-split):
  #  · claude-haiku-4(insight 배치)          → root → edge(gemma). 배치는 계정 장애 시 gemma 강등 허용.
  #  · claude-haiku-4-root                   → edge. **이전 결함 수정**: root 가 실패하면 litellm 이
  #    "No fallback model group found for claude-haiku-4-root" 로 edge 에 도달 못 하고 401 을 그대로
  #    올려, 두 계정 만료 시(주말/야간) 일부 요청이 gemma 로도 못 넘어가 완전 실패했다. root 를 명시
  #    fallback 키로 등록해 gemma 도달을 보장한다.
  #  · claude-haiku-4-interactive(분석: node_analysis/classify/topic) → interactive-root → edge. 두 계정
  #    완전 장애 시 gemma 로 강등(분석 무중단). ※ 대화(assistant 답변)는 아래 -chat alias 로 분리됨.
  #  · claude-haiku-4-interactive-root       → edge. (동일 결함 예방 — 명시 등록)
  #  · claude-haiku-4-chat(대화 답변)         → chat-root **로 끝**(edge 없음). 2026-07-07 사용자 결정:
  #    두 계정 모두 실패면 gemma 로 강등하지 않고 429/401 raise → agent_core 가 정직하게 실패 안내.
  #  · claude-haiku-4-chat-root              → **fallback 미등록**(체인 종단). 마지막 시도가 실패하면 그
  #    에러(429/401)를 그대로 올려 깨끗이 실패한다. edge 로 넘어가지 않는 것이 의도.
  #  · claude-sonnet-4-chat(대화 답변)        → sonnet-4-chat-root **로 끝**(edge 없음). sonnet-chat-fallback
  #    (2026-07-24): sonnet 도 haiku-chat 과 동형 2계정 체인. 두 계정 모두 실패면 429/401 raise(정직 실패).
  #  · claude-sonnet-4-chat-root             → **fallback 미등록**(체인 종단, edge 없음 — haiku-chat-root 동일).
  fallbacks:
    - {"claude-haiku-4": ["claude-haiku-4-root", "edge-fallback"]}
    - {"claude-haiku-4-root": ["edge-fallback"]}
    - {"claude-haiku-4-interactive": ["claude-haiku-4-interactive-root", "edge-fallback"]}
    - {"claude-haiku-4-interactive-root": ["edge-fallback"]}
    - {"claude-haiku-4-chat": ["claude-haiku-4-chat-root"]}
    - {"claude-sonnet-4-chat": ["claude-sonnet-4-chat-root"]}

# ── 모니터링 (옵션) ───────────────────────────────────────────────────
# LiteLLM 의 success/failure callback hook 으로 audit 확장 가능. 본 cycle 에서는
# stdout 로깅만 사용하고 audit row 의 token usage 누적은 후속 cycle.
# litellm_settings:
#   success_callback: ["log"]
#   failure_callback: ["log"]
