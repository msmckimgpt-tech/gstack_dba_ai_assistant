# 무제한 docker json-file 로그 누적 차단. 기본 driver 는 rotation 이 없어 장기
# 실행 시 컨테이너 로그가 수 GB 까지 자라 디스크/페이지캐시를 잠식한다(예: postgres·
# pgbouncer json 로그가 ~90MB/6h). 모든 서비스가 *default-logging 으로 상한.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-agent-common: &agent-common
  # 장기 실행 데몬의 누수/스레드 폭주가 호스트(특히 WSL2 vmmem)를 무한 잠식하지
  # 않도록 cgroup 상한. 현재 사용량(web ~96MB / insight ~122MB) 대비 넉넉한 headroom
  # 이라 정상 동작엔 무영향, runaway 만 차단. mem_limit 은 page cache 까지 cgroup 에
  # 귀속시켜 WSL2 VM 팽창 억제에도 기여한다.
  logging: *default-logging
  mem_limit: 1g
  pids_limit: 512
  build:
    context: .
    dockerfile: unit/feature-0002-agent-core/src/Dockerfile
    # TASK-0126 (#5 split-brain): 빌드 시 HEAD SHA 각인 (Makefile 이 export GIT_COMMIT).
    args:
      GIT_COMMIT: "${GIT_COMMIT:-unknown}"
  # CHG-20260522-0005 (feature-0007 follow-up): secret 영역별 env 분리. agent-
  # common 은 DB / KB / MinIO / LLM 자격증명을 모두 사용 (agent loop tool_use +
  # KB read + 첨부 read + LLM 호출). bedrock-gateway 의 AWS_* 는 본 chain 에
  # 포함 안 함 (least privilege).
  env_file:
    - .env
    - .env.mysql
    - .env.postgres
    - .env.minio
    - .env.llm
    # TASK-0205: datasource 자격증명 envelope 암호화 마스터 KEK (.env 분리 — least-privilege).
    # optional(required:false) — 미설정 환경은 datasource DB저장만 비활성(.env datasource 는 동작).
    - path: .env.secret
      required: false
    # TASK-20260619T034522-oauth-google-foundation: Google OAuth client 자격증명. web 의 OAuth 진입점
    # 전용이나 agent-common 공유 구조상 함께 inherit(agent/insight-worker 는 미사용 — 무해).
    # optional — 토대 기본 비활성(파일 부재 시 WEB_OAUTH_GOOGLE_ENABLED 미설정 → 엔드포인트 404).
    # web-only 분리는 후속(SECURITY.md §15.4 least-privilege 한계).
    - path: .env.oauth
      required: false
  environment:
    TZ: ${TZ}
    LANG: ${APP_LANG}
    LANGUAGE: ${APP_LANGUAGE}
    LC_ALL: ${APP_LC_ALL}
    PYTHONIOENCODING: utf-8
    # TASK-0130 (#5): 런타임/KB 정본이 PG 이므로 PG 장애 시 silent 빈-메모리 degradation
    # 대신 fail-loud. depends_on(postgres healthy) 과 함께 cold-boot 시 PG 미준비 상태로
    # ask 받는 것을 차단.
    AGENT_RUNTIME_PG_REQUIRED: "1"
  volumes:
    - ../artifacts/shared:/shared
  depends_on:
    mysql:
      condition: service_healthy
    bedrock-gateway:
      condition: service_healthy
    # TASK-0130 (#5): 런타임(agent_runtime)·KB·첨부 정본이 PG/pgbouncer/minio 에 있는데
    # 이전엔 depends_on 에 없어 cold up 시 web 이 PG ready 전 ask 수신 → silent degradation.
    postgres:
      condition: service_healthy
    pgbouncer:
      condition: service_healthy
    # minio 는 첨부 전용(보조) — healthcheck 일시 실패가 web/agent boot 를 막지 않도록
    # service_started(존재만 보장)로 둔다. 런타임 정본 postgres/pgbouncer 만 healthy 강제.
    minio:
      condition: service_started

services:
  mysql:
    image: mysql:${MYSQL_IMAGE_TAG}
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 4g
    pids_limit: 512
    # CHG-20260522-0005: .env.mysql 별 파일 (MYSQL_ROOT_PASSWORD / DB_PASSWORD).
    env_file:
      - .env
      - .env.mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      TZ: ${TZ}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - ../artifacts/shared:/shared
      - ../artifacts/mysql-data:/var/lib/mysql
      - ../artifacts/mysql-backup:/shared/mysql-backup
      - ./unit/feature-0001-platform-runtime/src/mysql/conf.d/99-mysql-ai-server.cnf:/etc/mysql/conf.d/99-mysql-ai-server.cnf:ro
      - ./unit/feature-0001-platform-runtime/src/mysql/conf.d/99-mysql-ai-client.cnf:/etc/mysql/conf.d/99-mysql-ai-client.cnf:ro
    networks: [dbnet]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  # TASK-0015 §2.1.3 M0 (REQ-20260520-0001 / TASK-0017 cycle): KB Postgres pgvector
  # 마이그레이션의 1차 인프라. M0 단계에서는 standalone 서비스로 추가하여 기존 agent
  # 흐름에 무영향 (agent.depends_on 에는 M2 dual-write phase 부터 추가). M1 cycle 에서
  # `agent_kb_rw` / `agent_kb_ro` role 신설 + ADR-0021 작성. M3 cycle 에서 `vector(N)`
  # 컬럼 + `ivfflat` / `hnsw` index 활용.
  # T3-9: PostgreSQL 서버 파라미터 조정 (command 절). WAL 별도 볼륨 (postgres-wal)은
  #   신규 설치 시에만 적용 가능 (기존 data dir 내 pg_wal 은 이동 불가). 신규 설치 시
  #   PGDATA=/var/lib/postgresql/data, PGWALDIR=/var/lib/postgresql/wal 지정.
  # T3-8: 에이전트는 직접 postgres:5432 가 아닌 pgbouncer:5432 로 연결 권장.
  #   .env.postgres 에서 AGENT_KB_PG_HOST=pgbouncer 으로 변경하면 자동 전환.
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 2g
    pids_limit: 512
    # CHG-20260522-0005: .env.postgres 별 파일 (AGENT_KB_PG_PASSWORD 외 role 별).
    env_file:
      - .env
      - .env.postgres
    environment:
      POSTGRES_DB: ${AGENT_KB_PG_DB:-agent_kb}
      POSTGRES_USER: ${AGENT_KB_PG_USER:-postgres}
      POSTGRES_PASSWORD: ${AGENT_KB_PG_PASSWORD:-change_me_pg}
      TZ: ${TZ}
    # T3-9: 서버 파라미터. Docker 환경 기준 (2–4 CPU, 2–4 GB RAM 가정).
    # shared_buffers=256MB: RAM 의 25% 목표. effective_cache_size=768MB: OS 페이지 캐시 포함.
    # wal_level=replica: T5-14 streaming replica 준비. max_wal_senders=3: replica 1개 + 여유.
    # shared_preload_libraries=pg_stat_statements: T3-10 슬로우 쿼리 추적.
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_buffers=16MB
      - -c
      - default_statistics_target=100
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - work_mem=4MB
      - -c
      - min_wal_size=512MB
      - -c
      - max_wal_size=2GB
      - -c
      - max_connections=100
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=3
      - -c
      - hot_standby=on
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    ports:
      - "${AGENT_KB_PG_PORT:-5432}:5432"
    volumes:
      - ../artifacts/postgres-data:/var/lib/postgresql/data
      - ../artifacts/postgres-wal:/var/lib/postgresql/wal
      - ../artifacts/shared:/shared
    networks: [dbnet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-agent_kb}"]
      interval: 10s
      timeout: 5s
      retries: 20

  # T3-8: PgBouncer — transaction-mode connection pooler.
  # 에이전트가 call 마다 새 TCP connection 을 여는 비용을 제거 (_pg_connect 패턴).
  # 에이전트는 pgbouncer:5432 (dbnet 내부) 로 연결 → PgBouncer 가 postgres 에 재사용.
  # 활성화: .env.postgres 에 AGENT_KB_PG_HOST=pgbouncer 설정.
  # pool mode: transaction — short-lived query 에 최적. prepared statement 비활성화 필요.
  #   (psycopg3 에서는 prepare=False 또는 pipeline 비활성화로 호환 가능.)
  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    pids_limit: 128
    env_file:
      - .env.postgres
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${AGENT_KB_PG_USER:-postgres}
      DB_PASSWORD: ${AGENT_KB_PG_PASSWORD:-change_me_pg}
      DB_NAME: ${AGENT_KB_PG_DB:-agent_kb}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "100"
      DEFAULT_POOL_SIZE: "20"
      AUTH_TYPE: scram-sha-256
      TZ: ${TZ}
    ports:
      - "${AGENT_KB_PGB_PORT:-6432}:5432"
    networks: [dbnet]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U ${AGENT_KB_PG_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # T5-14: Postgres streaming replica (opt-in, profiles: [replica]).
  # 기동 전 1회 초기화 필요:
  #   docker compose run --rm postgres-replica-init
  # 그 후: docker compose --profile replica up -d postgres-replica
  # 에이전트 read-only 연결: .env.postgres 에 AGENT_KB_PG_HOST_RO=postgres-replica 설정.
  postgres-replica:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    profiles: [replica]
    logging: *default-logging
    mem_limit: 1g
    pids_limit: 512
    env_file:
      - .env.postgres
    environment:
      POSTGRES_DB: ${AGENT_KB_PG_DB:-agent_kb}
      POSTGRES_USER: ${AGENT_KB_PG_USER:-postgres}
      POSTGRES_PASSWORD: ${AGENT_KB_PG_PASSWORD:-change_me_pg}
      PGUSER: ${AGENT_KB_PG_USER:-postgres}
      PGPASSWORD: ${AGENT_KB_PG_PASSWORD:-change_me_pg}
      TZ: ${TZ}
    command:
      - postgres
      - -c
      - hot_standby=on
      - -c
      - max_connections=100
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
    volumes:
      - ../artifacts/postgres-replica-data:/var/lib/postgresql/data
    networks: [dbnet]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-agent_kb}"]
      interval: 10s
      timeout: 5s
      retries: 20

  # T5-14: 1회성 replica 초기화 (pg_basebackup). 완료 후 컨테이너 종료.
  # 실행: docker compose run --rm postgres-replica-init
  postgres-replica-init:
    image: pgvector/pgvector:pg16
    restart: "no"
    profiles: [replica]
    logging: *default-logging
    env_file:
      - .env.postgres
    environment:
      PGPASSWORD: ${AGENT_KB_PG_PASSWORD:-change_me_pg}
      TZ: ${TZ}
    entrypoint:
      - "bash"
      - "-c"
      - >-
        rm -rf /replica-data/* &&
        pg_basebackup -h postgres -p 5432
        -U agent_kb_rw -D /replica-data -Xs -P -R &&
        echo 'pg_basebackup done. run: docker compose --profile replica up -d postgres-replica'
    volumes:
      - ../artifacts/postgres-replica-data:/replica-data
    networks: [dbnet]
    depends_on:
      postgres:
        condition: service_healthy

  agent:
    <<: *agent-common
    networks: [dbnet, llm-shared, replica-net]

  memory-init:
    <<: *agent-common
    entrypoint: ["python", "/app/agent_core.py", "--init-memory"]
    networks: [dbnet]
    restart: "no"
    # TASK-0019 (M2-a) outside-voice REV-20260520-0007 Critical: postgres race
    # condition mitigation. `agent_core.py:init_memory()` 가 `_pg_available()` true
    # 시 `_ensure_pg_schema()` 호출 — postgres 컨테이너 가 healthy 되기 전 호출
    # 시 OperationalError. mysql 외 postgres 도 service_healthy 까지 wait.
    # postgres 미가동 환경 (compose 에 postgres 서비스 없음) 에서는 본 depends_on
    # 도 silent skip (compose 가 미정의 서비스는 무시).
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
        required: false

  insight-worker:
    <<: *agent-common
    environment:
      TZ: ${TZ}
      LANG: ${APP_LANG}
      LANGUAGE: ${APP_LANGUAGE}
      LC_ALL: ${APP_LC_ALL}
      PYTHONIOENCODING: utf-8
      AGENT_SESSION: insight_worker
      AGENT_CONVERSATION_ID: __insight_worker__
      # TASK-0130: environment override 시 anchor 의 PG_REQUIRED 가 상속 안 되므로 명시.
      AGENT_RUNTIME_PG_REQUIRED: "1"
    entrypoint: ["python", "/app/agent_core.py", "--insight-worker"]
    networks: [dbnet, llm-shared, replica-net]
    restart: unless-stopped
    # TASK-0130 (#4): heartbeat 신선도 기반 healthcheck. advisory-lock 버그로 매 사이클
    # skip_locked 라 24h+ 무동작이어도 Docker 가 healthy 로 표기하던 것을 가시화.
    healthcheck:
      test: ["CMD", "python", "/app/scripts/healthcheck_insight_worker.py"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  # TASK-0169: out-of-process ask 실행 워커 (DESIGN-ask-worker.md / ADR-WEB-0004 B).
  # ask_jobs 큐에서 claim 해 run_agent 를 실행 → web 재배포/SIGTERM 이 in-flight run 을
  # 죽이지 않는다. web 은 AGENT_ASK_EXECUTION_MODE=worker 일 때만 enqueue 한다(기본
  # inprocess 라 이 서비스가 떠 있어도 그 자체로는 동작 변경 없음 — shadow 안전).
  ask-worker:
    <<: *agent-common
    environment:
      TZ: ${TZ}
      LANG: ${APP_LANG}
      LANGUAGE: ${APP_LANGUAGE}
      LC_ALL: ${APP_LC_ALL}
      PYTHONIOENCODING: utf-8
      AGENT_SESSION: ask_worker
      AGENT_CONVERSATION_ID: __ask_worker__
      # anchor 의 PG_REQUIRED 가 environment override 시 상속 안 되므로 명시(TASK-0130 패턴).
      AGENT_RUNTIME_PG_REQUIRED: "1"
      AGENT_ASK_WORKER_ENABLED: "1"
    entrypoint: ["python", "/app/agent_core.py", "--ask-worker"]
    networks: [dbnet, llm-shared, replica-net]
    restart: unless-stopped
    # SIGTERM 후 현재 실행 중 run 이 step 을 마칠 시간을 준다(기본 10s 면 mid-LLM-call
    # SIGKILL → stale → requeue). 한 step 예산(LLM timeout 60s + 여유) 보다 크게.
    stop_grace_period: 70s
    healthcheck:
      test: ["CMD", "python", "/app/scripts/healthcheck_ask_worker.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mcp:
    image: bytebase/dbhub:${DBHUB_IMAGE_TAG}
    restart: unless-stopped
    profiles: ["mcp"]
    logging: *default-logging
    mem_limit: 512m
    pids_limit: 256
    # CHG-20260522-0005: .env.mysql (DBHUB_DSN 의 DB_PASSWORD 치환용).
    env_file:
      - .env
      - .env.mysql
    environment:
      TZ: ${TZ}
      LANG: ${APP_LANG}
      LANGUAGE: ${APP_LANGUAGE}
      LC_ALL: ${APP_LC_ALL}
      DBHUB_LOG_LEVEL: ${DBHUB_LOG_LEVEL}
    ports:
      - "${MCP_HOST_PORT}:${MCP_PORT}"
    command:
      - --transport
      - ${MCP_TRANSPORT}
      - --host
      - 0.0.0.0
      - --port
      - "${MCP_PORT}"
      - --dsn
      - "${DBHUB_DSN}"
    networks: [dbnet]
    depends_on:
      mysql:
        condition: service_healthy

  web:
    <<: *agent-common
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "if [ -f \"$WEB_TLS_CERT_FILE\" ] && [ -f \"$WEB_TLS_KEY_FILE\" ] && [ \"$ENABLE_WEB_TLS\" = '1' ]; then exec uvicorn web.app:app --host 0.0.0.0 --port 8000 --ssl-keyfile \"$WEB_TLS_KEY_FILE\" --ssl-certfile \"$WEB_TLS_CERT_FILE\"; else exec uvicorn web.app:app --host 0.0.0.0 --port 8000; fi"]
    volumes:
      - ../artifacts/shared:/shared
      - ../artifacts/certs:/certs:ro
    ports:
      - "${WEB_PORT}:8000"
    networks: [dbnet, llm-shared, replica-net]
    # TASK-0130 (#5): /healthz 기반 healthcheck (https→http). 200=healthy, 503/미응답=unhealthy.
    healthcheck:
      test: ["CMD", "python", "/app/scripts/healthcheck_web.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    pids_limit: 128
    env_file:
      - .env
    environment:
      WEB_PUBLIC_HOST: ${WEB_PUBLIC_HOST}
      WEB_TLS_CERT_FILE: ${WEB_TLS_CERT_FILE}
      WEB_TLS_KEY_FILE: ${WEB_TLS_KEY_FILE}
    volumes:
      - ./unit/feature-0006-lan-proxy-access/src/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../artifacts/certs:/certs:ro
      # TASK-20260617T083954-ai-claude-trust-bundle: 테스터 Root CA 신뢰 설치 번들 (bin/trust-bundle.sh 가 조립). /trust/ 로 서빙.
      - ../artifacts/trust-bundle:/srv/trust:ro
      - ../artifacts/caddy-data:/data
      - ../artifacts/caddy-config:/config
    ports:
      - "${WEB_HTTP_PORT}:80"
      - "${WEB_HTTPS_PORT}:443"
    networks: [dbnet]
    depends_on:
      - web

  browser:
    build:
      context: .
      dockerfile: unit/feature-0004-browser-automation/src/Dockerfile
    restart: unless-stopped
    # Chromium/Playwright 은 장기 세션에서 메모리 누수가 흔하다 — 넉넉히 캡.
    logging: *default-logging
    mem_limit: 3g
    pids_limit: 1024
    env_file:
      - .env
    environment:
      BROWSER_SCREENSHOT_DIR: /shared/out/browser
    volumes:
      - ../artifacts/shared:/shared
    ports:
      - "${BROWSER_PORT}:8001"
    networks: [dbnet]

  # ── AWS Bedrock OpenAI-compatible gateway (feature-0007) ─────────────
  # LiteLLM proxy 가 `OpenAI(api_key, base_url)` 호출을 받아 AWS Bedrock 의
  # `bedrock-runtime:InvokeModel` 로 라우팅한다. AWS 자격증명은 본 컨테이너 env
  # 로만 주입되며, backend / frontend 는 BEDROCK_GATEWAY_API_KEY (gateway token)
  # 만 인지한다 (사용자 결정 5 항목 정합). 외부 expose 안 함 — dbnet 내부에서만
  # 접근 가능.
  bedrock-gateway:
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1g
    pids_limit: 256
    # CHG-20260522-0005: .env.bedrock (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
    # bedrock-gateway 전용 least privilege) + .env.llm (BEDROCK_GATEWAY_API_KEY
    # 인증 token).
    env_file:
      - .env
      - .env.bedrock
      - .env.llm
    environment:
      TZ: ${TZ}
    volumes:
      - ./unit/feature-0007-bedrock-llm-provider/src/config/litellm_config.yaml:/app/config.yaml:ro
    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "8080"
    networks: [dbnet]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health/liveliness',timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # TASK-0094 (REQ-20260521-0001, Critical §12.3) Sprint 1 Phase 1 — ADR-0022
  # MinIO S3-compat 첨부 객체 스토리지. BRIEFING D1 사용자 직접 확정. 사내망
  # 다운로드는 signed URL (frontend 전용), 외부 LLM 송신은 server-side bytes
  # read 후 base64/files API 로 전달 (BRIEFING D13). minio-init 부트스트랩이
  # bucket idempotent 생성 + lifecycle policy (D6 delete_reason 별 retention) +
  # root credential 비활성화 + app 전용 key 생성. App key rotation 은 D20
  # dual-key rotation runbook 따름 (Sprint 1 Phase 4 ship 조건).
  minio:
    image: minio/minio:RELEASE.2024-12-13T22-19-12Z
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1g
    pids_limit: 256
    # CHG-20260522-0005: .env.minio 별 파일 (MINIO_ROOT_PASSWORD / app key/secret).
    env_file:
      - .env
      - .env.minio
    environment:
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-}
      TZ: ${TZ}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ../artifacts/minio-data:/data
    networks: [dbnet]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # TASK-0094 Sprint 1 Phase 1 — minio-init one-shot bootstrap.
  # ADR-0022 의 idempotent bucket 생성 + lifecycle policy + root credential
  # 비활성화 + app 전용 access key 생성. Container exit 0 후 종료. App key
  # rotation 은 D20 runbook 의 dual-valid window 별 cycle subtask 로 처리.
  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    restart: "no"
    logging: *default-logging
    # CHG-20260522-0005: .env.minio 별 파일 (root + app key/secret 부트스트랩).
    env_file:
      - .env
      - .env.minio
    environment:
      MINIO_BUCKET: ${MINIO_BUCKET:-agent-attachments}
      TZ: ${TZ}
    volumes:
      - ./unit/feature-0003-agent-web-ui/src/scripts/minio-init.sh:/usr/local/bin/minio-init.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/minio-init.sh"]
    networks: [dbnet]
    depends_on:
      minio:
        condition: service_healthy

networks:
  dbnet:
  llm-shared:
    external: true
    name: llm-shared
  replica-net:
    external: true
    name: ${REPLICA_NETWORK_NAME:-replica-net}
