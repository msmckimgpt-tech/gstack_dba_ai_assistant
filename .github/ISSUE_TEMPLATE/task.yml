name: 작업 태스크
description: 문서화, 정리, 운영 작업 같은 범용 태스크를 AI 작업 단위로 정의합니다.
title: "[Task] "
labels:
  - task
  - source:human
  - status:ready
body:
  - type: textarea
    id: goal_background
    attributes:
      label: 목표 / 배경
      description: 왜 이 작업이 필요한지 적어주세요.
      placeholder: |
        - 현재 상태:
        - 필요한 정리/개선:
    validations:
      required: true
  - type: input
    id: target_scope
    attributes:
      label: 대상 feature 또는 경로
      description: 가능한 한 `unit/<feature-id>` 또는 파일/디렉토리 경로로 적어주세요.
      placeholder: "예: docs/STATUS.md"
    validations:
      required: true
  - type: textarea
    id: success_criteria
    attributes:
      label: 성공 기준
      description: 완료 판정 기준을 적어주세요.
      placeholder: |
        - [ ] 문서/설정/구조가 원하는 상태가 된다
        - [ ] 필요한 검증이 끝난다
    validations:
      required: true
  - type: textarea
    id: validation_plan
    attributes:
      label: 검증 방법
      description: 정적 검토, 실행 확인, 리뷰 포인트를 적어주세요.
      placeholder: |
        - 문서 링크 검토
        - git diff 확인
        - 필요 시 make status
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: 제약사항
      description: 범위 제외, 승인 필요 항목, 유지해야 할 정책을 적어주세요.
      placeholder: |
        - 원본 규칙 유지
        - 외부 서비스 설정은 문서화만
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 참고 로그 / 문서 / 이슈
      description: 관련 문서, 선행 이슈, 참고 자료를 적어주세요.
      placeholder: |
        - CONTRIBUTING.md
        - AGENTS.md
        - #56
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        기본 provider는 저장소 변수 `AI_PROVIDER_DEFAULT`를 따릅니다.
        특정 AI를 강제하려면 `agent:codex` 또는 `agent:claude` 라벨을 추가하세요.
        이 템플릿은 `status:ready`를 기본값으로 붙이지만, 자동화의 필수 gate는 아닙니다.
