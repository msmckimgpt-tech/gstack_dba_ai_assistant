<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>공유된 대화</title>
  <link rel="stylesheet" href="/static/share.css?v=dev" />
</head>
<body class="share-body">
  <div class="share-container">
    <header class="share-header">
      <div class="share-header-inner">
        <span class="share-brand">공유된 대화</span>
        <h1 id="shareTopic" class="share-topic">대화 로딩 중...</h1>
        <div class="share-meta">
          <span id="shareOwner" class="share-meta-item"></span>
          <span id="shareScope" class="share-meta-item"></span>
          <span id="shareProduct" class="share-meta-item"></span>
          <span id="shareExpiry" class="share-meta-item"></span>
          <!-- share-bar-layout: 조회수는 하단 바에서 상단 meta 로 이동 — 대화 정보(소유자·범위·제품·만료)와 한 줄에 모은다. -->
          <span id="shareViewCount" class="share-meta-item"></span>
        </div>
      </div>
    </header>
    <main id="shareMessages" class="share-messages">
      <div class="share-loading">로딩 중...</div>
    </main>
    <!-- REQ-20260629-point-scroll: 공유 대화 우측 스크롤바 가이드 뱃지(point rail).
         position:fixed 미니맵 — share.js setupSharePointRail 가 dot 을 채운다. -->
    <nav class="share-point-rail hidden" id="sharePointRail" aria-label="대화 메시지 빠른 이동"></nav>
    <footer class="share-footer">
      <span class="share-footer-note">사내 공유용 — 외부 IP 로 전달 시 데이터 노출 위험이 있습니다.</span>
      <!-- share-bar-layout: 액션(링크 복사·참여·fork)은 헤더에서 하단 바 우측으로 이동.
           읽는 영역(제목·meta)과 조작 영역을 상/하로 분리해 본문 폭을 넓게 쓴다.

           share-client-entry (사용자 결정 2026-09-08): **열람은 이 브라우저에서 끝나지만
           참여·fork 는 DQA 앱에서 한다.** 그래서 이 자리에는 서로 배타적인 두 벌이 있다 —
           앱 창 안에서 보이는 직접 실행 버튼(join·fork)과, 평범한 브라우저에서 보이는
           앱 진입 버튼. 어느 쪽을 보일지는 `share.js` 가 브리지 좌표로 판정한다. -->
      <div class="share-actions">
        <button type="button" id="shareCopyLinkBtn" class="share-copy-link-btn">링크 복사</button>
        <!-- feature-0009: 공유 링크로 그룹 대화 참여(join). **앱 창 안에서만** 보인다. -->
        <button type="button" id="shareJoinBtn" class="share-join-btn hidden">대화에 참여</button>
        <button type="button" id="shareForkBtn" class="share-fork-btn hidden">내 계정에서 fork</button>
        <!-- 평범한 브라우저에서 보이는 유일한 진입. 누르면 `dqa-connect://open?…&path=/share/<token>`
             으로 앱을 띄우고, 앱 창이 **이 대화를** 연다(서비스 루트가 아니다).
             ⚠ 브라우저는 스킴 핸들러 부재를 감지하지 못한다 — 그래서 누른 뒤 아래 안내가
             뜨고, 받을 수 있을 때만 [DQA 앱 받기] 가 함께 보인다(없는 다운로드는 안내하지 않는다). -->
        <button type="button" id="shareAppEntryBtn" class="share-app-btn hidden">DQA 앱에서 참여 · fork</button>
        <a class="share-app-get hidden" id="shareAppGetLink" href="#">DQA 앱 받기</a>
        <!-- ⚠ **열화 분기에서만** 보인다 (3R H2). 앱 전용 분기에서는 종전 결정대로 감춘다.
             이것이 없던 동안, 미로그인 수신자는 열화 세 갈래(앱 창 안 · 받을 곳 없음 ·
             비-Windows) **어디에서도** 제품에 들어갈 길이 없었다 — 그 화면의 유일한 버튼이
             [링크 복사] 였다(실측). 열화의 목적은 「종전 웹 경로를 살려 둔다」인데 그 경로의
             미로그인 진입점만 함께 지우면 열화가 자기 목적을 배반한다. -->
        <a href="/" class="share-login-link hidden" id="shareLoginLink">로그인하고 참여 · fork</a>
      </div>
      <!-- 앱 진입을 누른 뒤에만 뜬다. 미리 띄우면 아무 일도 없었는데 경고부터 읽게 된다. -->
      <!-- ⚠ 문구는 **자식 span** 에 넣는다. 좁은 폭에서는 [DQA 앱 받기] 가 이 문단 안으로
           접혀 들어오는데(share.js `compactFooterForNarrow`), 문단에 직접 `textContent` 를
           대입하면 그 링크가 **함께 지워진다** — 실측으로 그렇게 사라졌다. -->
      <p class="share-app-hint hidden" id="shareAppHint" role="status" aria-live="polite"><span id="shareAppHintText"></span></p>
    </footer>
  </div>
  <script src="/static/vendor/marked.umd.js"></script>
  <script src="/static/vendor/purify.min.js"></script>
  <!-- feature-0013 후속: 공유 대화에서도 mermaid 다이어그램 렌더(메인 UI 와 동일 strict 경로) -->
  <script src="/static/vendor/mermaid.min.js?v=mermaid-10.9.3"></script>
  <script src="/static/mermaid-render.js?v=dev"></script>
  <!-- ⚠ 순서가 계약이다 — 이 모듈이 `share.js` 보다 **먼저** 돌아야 「앱 안인가」 판정이
       선다. `type="module"` 은 암묵 defer 이고 아래 `share.js` 도 defer 라, 둘은 같은 큐에
       문서 순서대로 들어간다(`share-client-context.js` 상단 주석 참조). -->
  <script type="module" src="/static/share-client-context.js?v=dev"></script>
  <script defer src="/static/share.js?v=dev"></script>
  <script src="/static/textarea-autogrow.js?v=dev"></script>
</body>
</html>
