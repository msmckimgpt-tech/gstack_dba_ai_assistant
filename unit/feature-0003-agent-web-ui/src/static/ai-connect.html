<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>내 AI 연결하기</title>
  <link rel="stylesheet" href="/static/ai-connect.css?v=dev" />
</head>
<body class="aic-body">
  <main class="aic-card">
    <p class="aic-brand">Database Query Assistant</p>
    <h1>내 AI 연결하기</h1>
    <p class="aic-lead" id="connectLead">확인하는 중…</p>

    <!-- 단일 흐름(2026-08-27): 연결 방법을 사람에게 고르게 하지 않는다. 연결 정보를 AI 가
         읽을 지시문 한 덩어리로 만들어 주고, 어느 방법이 되는지는 AI 가 시도해 판단한다.
         화면 문구는 짧게 유지한다 — 사용자는 구조 설명이 아니라 할 일을 찾으러 온다. -->
    <section id="connectFlow" class="aic-hidden">
      <p class="aic-why">
        아래에서 연결 정보를 만들어 쓰시는 AI에 붙여넣으면 됩니다.
        연결 방식 선택과 인증은 AI가 알아서 합니다.
      </p>

      <div class="aic-actions" style="justify-content:flex-start">
        <button type="button" class="aic-btn aic-btn--primary" id="makeHandoff">연결 정보 만들기</button>
      </div>

      <div id="handoffResult" class="aic-hidden" style="margin-top:16px">
        <p class="aic-handoff-hint">아래 내용을 AI에 그대로 붙여넣으세요.</p>
        <div class="aic-code aic-code--block" id="handoffText"></div>
        <div class="aic-actions" style="justify-content:flex-start">
          <button type="button" class="aic-btn aic-btn--primary" id="copyHandoff">복사</button>
        </div>
      </div>

      <div class="aic-note">
        <p>연결 정보에는 <strong>토큰</strong>이 들어갑니다. 내 권한으로 데이터를 조회하므로
           비밀번호처럼 다루고 남에게 주지 마세요.</p>
        <p>로그아웃하면 무효가 되고, <strong>이 화면을 벗어나면 다시 볼 수 없습니다.</strong></p>
      </div>
    </section>

    <p class="aic-status" id="connectStatus"></p>

    <section id="connectLogin" class="aic-hidden">
      <p>먼저 로그인하세요.</p>
      <div class="aic-actions" style="justify-content:flex-start">
        <a class="aic-btn aic-btn--primary" id="loginLink" href="/?next=%2Fai%2Fconnect">로그인하러 가기</a>
      </div>
    </section>

  </main>
  <script src="/static/ai-connect.js?v=dev"></script>
</body>
</html>
