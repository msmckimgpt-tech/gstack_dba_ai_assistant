<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MySQL AI Assistant Admin</title>
  <link rel="stylesheet" href="/static/styles.css?v=20260415b" />
</head>
<body class="admin-shell">
  <header class="topbar">
    <div class="topbar-brand">
      <div class="brand-icon">AD</div>
      <span class="brand-name">계정/권한 관리</span>
    </div>
    <div class="topbar-end">
      <button type="button" class="topbar-btn" id="backToAppBtn">작업 화면</button>
      <button type="button" class="topbar-btn" id="adminLogoutBtn">로그아웃</button>
      <button type="button" class="btn-secondary" id="refreshAdminBtn">새로고침</button>
    </div>
  </header>

  <main class="admin-grid admin-shell">
    <section class="surface-card">
      <div class="section-row">
        <div>
          <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--text-muted);margin-bottom:3px">Overview</div>
          <h2>승인 대기와 권한 충돌을 한 화면에서 정리</h2>
        </div>
      </div>
      <div class="summary-metrics">
        <article class="metric-card">
          <span>Pending</span>
          <strong id="metricPending">0</strong>
        </article>
        <article class="metric-card">
          <span>Operator</span>
          <strong id="metricOperator">0</strong>
        </article>
        <article class="metric-card">
          <span>Admin</span>
          <strong id="metricAdmin">0</strong>
        </article>
        <article class="metric-card">
          <span>Disabled</span>
          <strong id="metricDisabled">0</strong>
        </article>
      </div>
    </section>

    <section class="surface-card">
      <div class="section-row">
        <div>
          <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--text-muted);margin-bottom:3px">Accounts</div>
          <h2>사용자 목록</h2>
        </div>
      </div>
      <div class="admin-accounts" id="adminAccounts"></div>
    </section>
  </main>

  <div class="toast" id="adminToast"></div>

  <script src="/static/admin.js?v=20260415b"></script>
</body>
</html>
