name: CI

# TASK-0126 (#11): 머지 차단 게이트. PR→main 에서 pytest 단위 테스트 + ruff 린트 실행.
# ruff 는 대규모 레거시 정리(Task 9) 전까지 비차단(continue-on-error). pytest 는 차단.
# (브랜치 보호 규칙은 GitHub repo settings 에서 "CI / test" required 로 활성화.)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r unit/feature-0002-agent-core/src/requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff) — 초기 비차단
        continue-on-error: true
        run: ruff check unit/feature-0002-agent-core/src unit/feature-0003-agent-web-ui/src

      - name: Guard — no raw AgentMemory* write SQL in live KB/runtime callers (TASK-0127 #1)
        run: |
          # 2026-05-27 cutover 회귀 차단: 라이브 ask/insight write 경로(memory/knowledge/utils)에
          # DROP 된 MySQL AgentMemory* 테이블 대상 raw INSERT/UPDATE/DELETE 재출현 시 실패.
          # (kb_backend.py 의 MysqlKbBackend 방언 구현체와 admin-only kb_ingest.py 는 별도 정리 대상이라 제외.)
          if grep -rnE "(INSERT( IGNORE)? INTO|UPDATE|DELETE FROM)\s+\`?AgentMemory" \
               unit/feature-0002-agent-core/src/modules/memory.py \
               unit/feature-0002-agent-core/src/modules/knowledge.py \
               unit/feature-0002-agent-core/src/modules/utils.py; then
            echo "::error::raw AgentMemory* write SQL 재출현 (cutover 회귀) — PG 백엔드(_dual_write_kb / PgRuntimeBackend) 사용 필요"
            exit 1
          fi
          echo "OK: 라이브 write 경로에 raw AgentMemory* SQL 없음"

      - name: Unit tests (pytest)
        env:
          # PYTHONPATH 에 repo 루트(.) 포함 — app.py 가 import 하는 최상위 `shared` 패키지 해소.
          # (Makefile `test` 타깃의 컨테이너 PYTHONPATH `…:/work` 와 동일 의미. 누락 시 `No module
          #  named 'shared'` 로 feature-0003 테스트 일괄 collection 실패.)
          PYTHONPATH: unit/feature-0002-agent-core/src:unit/feature-0003-agent-web-ui/src:.
          DB_USER: root
          DB_PASSWORD: test
          AGENT_MEMORY_DB: agent_memory
        run: |
          # 일부 테스트(예: test_share_redaction_invariant)는 컨테이너 `/app/web` 레이아웃을 가정해
          # `import web.app` 을 직접 호출한다. bare-runner 에선 repo 루트에 `web` 네임스페이스가 없어
          # collection 이 실패하므로, web → feature-0003 src 심링크로 컨테이너와 동형 경로를 만든다.
          ln -sfn unit/feature-0003-agent-web-ui/src web
          pytest -q unit/feature-0002-agent-core/tests unit/feature-0003-agent-web-ui/tests
