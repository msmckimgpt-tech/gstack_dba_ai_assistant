<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="icon" href="/static/brand/dqa.ico?v=dev" />
  <link rel="icon" type="image/svg+xml" sizes="any" href="/static/brand/dqa.svg?v=dev" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>내 AI 연결하기</title>
  <!-- ⚠ **서비스 디자인 시스템을 먼저 싫는다** (2026-09-04). 이 화면은 종전에
       자기만의 토큰(--aic-*)을 정의하는 «디자인 섬» 이었고, 같은 뜻의 색이
       서비스와 값이 달랐다(강조 #1f6feb vs #2563eb, 배경 #f6f7f9 vs #f7f7f4).
       규칙은 그대로 두고 **토큰의 출처만** 시스템으로 옮긴다. -->
  <link rel="stylesheet" href="/static/css/base.css?v=dev" />
  <link rel="stylesheet" href="/static/ai-connect.css?v=dev" />
</head>
<body class="aic-body">
  <main class="aic-card">
    <p class="aic-brand">Database Query Assistant</p>
    <h1>내 AI 연결하기</h1>
    <p class="aic-lead" id="connectLead">확인하는 중…</p>

    <!-- 단일 흐름(2026-08-27 → 2026-09-07): 연결 방법을 사람에게 고르게 하지 않는다.
         종전에는 「AI 가 읽을 지시문 한 덩어리」가 그 단일 흐름이었고, 뒤에 터미널 명령이
         기본 경로로 들어왔다. 지금은 **DQA 앱 하나**다 — 사용자 결정으로 나머지를 모두
         지웠다. 화면 문구는 짧게 유지한다 — 사용자는 구조 설명이 아니라 할 일을 찾으러 온다. -->
    <section id="connectFlow" class="aic-hidden">
      <!-- feature-0043 P0-X: 이 화면과 대화 모달은 **같은 것**을 보여야 한다. 한쪽만
           경로를 남기면 링크를 새 탭으로 연 사용자와 모달에서 본 사용자가 다른 안내를
           받는다 — 2026-09-07 의 「전면 제거」도 두 화면에 **함께** 적용한다. -->
      <p class="aic-why">
        내 AI를 이 서비스에 연결하면 질문에 답할 수 있습니다.
        연결은 <strong>DQA 앱</strong>이 합니다 — 앱 창이 이 컴퓨터의 AI를 찾아 바로
        연결하고, 한 번 연결한 뒤에는 <strong>시작 메뉴의 아이콘</strong>만 눌러도
        그 창이 열립니다.
      </p>

      <!-- ROADMAP ITEM-06: 클라이언트를 **받을 수 있을 때만** 보인다. 서버가 실물 존재를
           확인해 `client_download` 를 낼 때만 채워진다 — 없는 다운로드를 안내하면 사용자는
           안내받은 대로 갔다가 막힌다(P0-I). -->
      <section id="clientFirst" class="aic-note aic-hidden" style="margin-bottom:12px">
        <p><strong>아직 DQA 앱이 없다면</strong> — 받아서 실행하면 로그인과 연결을
           그 창에서 끝낼 수 있습니다.</p>
        <div class="aic-actions" style="justify-content:flex-start">
          <a class="aic-btn aic-btn--primary" id="clientDownload" href="#">DQA 앱 받기</a>
        </div>
        <p class="aic-handoff-hint" id="clientNote"></p>
      </section>

      <!-- ROADMAP ITEM-03: 「어디서 막혔는지」를 화면이 말한다. 판정은 서버 한 곳이고
           여기는 그린다 — 프런트가 조립하면 이 화면과 대화 모달이 갈린다(P0-L). -->
      <!-- ⚠ **클라이언트 패널** (2026-09-04). 연결 프로그램이 이 화면을 앱 창으로 열면
           `?client_port=&client_nonce=` 가 붙고, 그때만 나타난다. 화면은 서비스에 하나만
           두기로 한 결정(P0-S)의 실체다 — 클라이언트 안에 화면 사본을 만들지 않는다.
           브리지가 붙지 않은 평범한 방문에서는 **아무것도 보이지 않는다**. -->
      <section id="clientPanel" class="aic-hidden" style="margin-bottom:14px">
        <p class="aic-handoff-hint"><strong id="clientPanelTitle">이 컴퓨터의 AI</strong></p>
        <ul id="clientRuntimes" style="list-style:none;padding-left:0;margin:8px 0"></ul>
        <div class="aic-actions" style="justify-content:flex-start">
          <button type="button" class="aic-btn" id="clientRefresh">다시 찾기</button>
          <button type="button" class="aic-btn aic-btn--primary" id="clientConnect" disabled>이 서비스에 연결</button>
        </div>
        <p class="aic-status" id="clientPanelStatus"></p>
        <!-- ⚠ 비워 둔 채 렌더한다. 채우는 것은 `status.resident` 를 받은 뒤이고, 그 값은
             **껍데기가 알림 영역 아이콘을 실제로 띄웠을 때만** 참이다. 프런트가 추정해
             「닫아도 유지됩니다」를 먼저 쓰면 트레이 없는 머신에서 거짓이 된다(P0-R). -->
        <p class="aic-handoff-hint" id="clientResidency"></p>
      </section>
      <section id="connectSteps" class="aic-hidden" style="margin-bottom:12px">
        <p class="aic-handoff-hint"><strong id="stepsSummary"></strong></p>
        <ul id="stepsList" style="list-style:none;padding-left:0;margin:8px 0"></ul>
      </section>

      <!-- ⚠ **「연결 준비」·터미널·AI 지시문은 없다** (사용자 결정 2026-09-07):
           「이제 '연결 준비' 의 역할은 클라이언트가 모두 수행하도록 구성될 부분이니,
            터미널 및 AI에게 연결을 요청하는 부분은 제거해주세요.」
           남은 길은 DQA 앱 하나다 — 위 [DQA 앱 받기](받을 수 있을 때만) 또는 아래
           [내 AI 실행](이미 설치한 머신). 대화 모달과 **같은 결정**이어야 한다:
           둘이 갈리면 어떤 사용자는 옛 화면을 본다.
           ⚠ 종전과 달리 **감추지 않는다.** 감추던 근거는 「[연결 준비] 로 프로토콜 URL 을
           받은 뒤에만 보인다」였는데, 그 버튼이 사라졌으므로 이 버튼이 스스로 받는다. -->
      <div class="aic-actions" style="justify-content:flex-start">
        <button type="button" class="aic-btn aic-btn--primary" id="launchClient"
                title="이미 설치를 마친 머신에서 DQA 앱을 실행합니다">내 AI 실행</button>
      </div>

      <!-- 배경 작업 동의 (TASK-20260901T190000, 사용자 결정 "웹페이지에서 토글").
           종전 표현 수단은 러너 CLI 플래그 `--batch` 뿐이라, 온보딩 명령을 복사해 붙인
           사람은 그런 선택지가 있는 줄도 몰랐다. 여기서 켜고 끈다. -->
      <section id="batchConsentBox" class="aic-note aic-hidden" style="margin-top:16px">
        <label style="display:flex;gap:10px;align-items:flex-start;cursor:pointer">
          <input type="checkbox" id="batchConsent" style="margin-top:3px">
          <span>
            <strong>배경 작업도 내 AI 가 처리</strong>
            <span id="batchConsentNotice" style="display:block;margin-top:4px;opacity:.85"></span>
          </span>
        </label>
        <p id="batchConsentStatus" class="aic-status" style="margin:8px 0 0"></p>
      </section>

    </section>

    <p class="aic-status" id="connectStatus"></p>

    <section id="connectLogin" class="aic-hidden">
      <p>먼저 로그인하세요.</p>
      <div class="aic-actions" style="justify-content:flex-start">
        <a class="aic-btn aic-btn--primary" id="loginLink" href="/?next=%2Fai%2Fconnect">로그인하러 가기</a>
      </div>
    </section>

  </main>
  <script src="/static/ai-connect.js?v=dev"></script>
</body>
</html>
