# TASK-0126 (#11): 프로젝트 도구 설정 (ruff 린트 + pytest). 패키징 메타는 아님.

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["**/__pycache__", "**/.pytest_cache"]

[tool.ruff.lint]
# 초기 게이트: 실제 버그성 규칙 위주 (pyflakes F + 구문 E9). 스타일/임포트 정리는
# Task 9(죽은 코드 정리)에서 점진 확대. 현재는 CI 에서 continue-on-error 로 비차단.
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
# TASK-0127 (#11): CI 를 "회귀 시에만 적색" 게이트로 만들기 위해 도입했던 8건 deselect 는
# TASK-0139 (ci-deselect-repair) 에서 전부 복구되어 제거되었다. 실제 실패 원인은
# "라이브 환경 의존" 이 아니라 테스트/코드 stale 였음 (실행 근거 기반):
#   - test_anchor_invariant_postgres S6: stale DDL marker (regular VIEW → MATERIALIZED
#     VIEW T2-4 전환을 테스트가 미반영) → marker regex 갱신. 검증 invariant (DISTINCT ON
#     + weight/updated_at/id DESC tie-break) 는 그대로 유지.
#   - test_anchor_invariant_postgres N1: _FakeCursor 가 production 의 cur.rowcount /
#     lastrowid 미구현 → FakeCursor 보강 (mock 만으로 통과, 라이브 PG 불필요).
#   - test_m5_cleanup 6건: bin/kb-cleanup-mysql.sh 가 `set -euo pipefail` + `.env` grep
#     pipefail 로, wrapper `.env` 없는 격리 환경에서 arg 파싱 전 rc=2 로 조용히 종료
#     (PATH 문제 아님). grep 파이프라인을 `|| true` 로 무해화하여 수정.
# 신규 회귀는 그대로 검출된다.
addopts = "-q"
# Shared by direct pytest, Makefile test, and CI; entrypoints must not override paths.
testpaths = [
    "unit/feature-0002-agent-core/tests",
    "unit/feature-0003-agent-web-ui/tests",
    # feature-0014 (2026-08-11): 배포 스파인의 **엣지 후보 복귀 게이트** 회귀 잠금.
    # 이 디렉토리는 그동안 testpaths 밖이라 Caddyfile/deploy-web.sh 의 무중단 불변식을
    # 잠그는 테스트가 하나도 돌지 않았고, 롤링 간격 < passive 격리 로 인한 전면 503 이
    # 6시간에 71건 나는 동안 CI 는 계속 초록이었다(AGENTS.md §16.7 G10).
    "unit/feature-0014-zero-downtime-deploy/tests",
    # feature-0020 (2026-08-12): 워커·gateway 교체의 **quiesce 게이트** 회귀 잠금.
    # 같은 함정을 반복하지 않기 위해 디렉토리 생성과 동시에 등재한다 — 위 feature-0014
    # 주석이 기록한 그대로, testpaths 밖 테스트는 존재해도 아무것도 지키지 못한다.
    "unit/feature-0020-zd-deploy-all/tests",
    # feature-0046 (2026-09-04): 네이티브 클라이언트 테스트가 **CI 와 testpaths 어디에도
    # 없었다** — 2026-09-03 신설 이후 로컬에서만 돌았다. 바로 위 feature-0014 주석이 경고한
    # 그 형태이고(로컬 green · CI 는 그 축을 보지 않음), 이 파일과 ci.yml 의 목록이 서로
    # 다르다는 사실 자체가 재발 신호다(§16.7 G14-e — 존재는 실행이 아니다).
    # ⚠ Win32/트레이 층은 리눅스에서 돌지 않는다 — 그 층의 실측은 그 feature 의
    # `tests/windows/`(pytest 수집 대상 아님, README 에 실행법)가 담당한다.
    "unit/feature-0046-native-client/tests",
    "unit/feature-0023-conversation-api-access/tests",
    "unit/feature-0041-external-ai-tool-surface/tests",
    "unit/feature-0043-external-llm-bridge/tests",
    "unit/feature-0008-windows-browser-testing/tests",
    "unit/feature-0006-lan-proxy-access/tests",
]
