<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MySQL AI Assistant Admin</title>
  <link rel="stylesheet" href="/static/styles.css?v=20260415a" />
</head>
<body class="page-shell admin-shell">
  <header class="app-header admin-header">
    <div class="brand-block">
      <div class="brand-mark">AD</div>
      <div>
        <div class="eyebrow">Administration</div>
        <div class="brand-title">계정/권한 관리</div>
      </div>
    </div>

    <div class="header-actions">
      <button type="button" class="secondary-button" id="backToAppBtn">작업 화면</button>
      <button type="button" class="secondary-button" id="adminLogoutBtn">로그아웃</button>
    </div>
  </header>

  <main class="admin-grid">
    <section class="surface-card admin-summary-card">
      <div class="section-row">
        <div>
          <div class="eyebrow">Overview</div>
          <h1>승인 대기와 권한 충돌을 한 화면에서 정리</h1>
        </div>
        <button type="button" class="secondary-button" id="refreshAdminBtn">새로고침</button>
      </div>
      <div class="summary-metrics">
        <article class="metric-card">
          <span>Pending</span>
          <strong id="metricPending">0</strong>
        </article>
        <article class="metric-card">
          <span>Operator</span>
          <strong id="metricOperator">0</strong>
        </article>
        <article class="metric-card">
          <span>Admin</span>
          <strong id="metricAdmin">0</strong>
        </article>
        <article class="metric-card">
          <span>Disabled</span>
          <strong id="metricDisabled">0</strong>
        </article>
      </div>
    </section>

    <section class="surface-card account-admin-card">
      <div class="section-row">
        <div>
          <div class="eyebrow">Accounts</div>
          <h2>사용자 목록</h2>
        </div>
      </div>
      <div class="admin-accounts" id="adminAccounts"></div>
    </section>
  </main>

  <div class="toast" id="adminToast"></div>

  <script src="/static/admin.js?v=20260415a"></script>
</body>
</html>
