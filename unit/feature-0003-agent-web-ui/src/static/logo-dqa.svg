<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="DQA Logo">
  <!-- Background rounded square -->
  <rect width="48" height="48" rx="10" fill="#2563eb"/>

  <!-- Database cylinder (body) -->
  <ellipse cx="22" cy="16" rx="9" ry="3.5" fill="#bfdbfe"/>
  <rect x="13" y="16" width="18" height="12" fill="#93c5fd"/>
  <ellipse cx="22" cy="28" rx="9" ry="3.5" fill="#bfdbfe"/>

  <!-- Cylinder top highlight -->
  <ellipse cx="22" cy="16" rx="9" ry="3.5" fill="none" stroke="#eff6ff" stroke-width="1"/>

  <!-- Query magnifier -->
  <circle cx="32" cy="33" r="5.5" fill="none" stroke="#fff" stroke-width="2"/>
  <line x1="36" y1="37" x2="39.5" y2="40.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
</svg>
