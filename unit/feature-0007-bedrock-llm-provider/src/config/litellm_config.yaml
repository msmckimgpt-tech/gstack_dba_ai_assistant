# LiteLLM Proxy 설정 — AWS Bedrock (Seoul region `ap-northeast-2`) 라우팅
#
# 본 파일은 bedrock-gateway 컨테이너 (docker-compose `bedrock-gateway` 서비스) 가
# `/app/config.yaml` 경로로 read-only mount 한다. backend / frontend 는 `model`
# 필드에 아래 `model_name` (alias) 만 보내고, LiteLLM 이 `litellm_params.model`
# 의 실제 Bedrock model ID 로 라우팅한다.
#
# 실 model ID 는 AWS Bedrock 의 console (Seoul region) 에서 확인 후 갱신한다.
# 아래 값은 2026-05-21 시점의 추정 schema 이며, 운영자가 batch 시점에 사실 검증
# 필요. Claude 4.x 의 정확한 versioned model ID (예: `-20250514-v1:0`) 는 AWS
# Bedrock 의 "Model access" 페이지에 표시되는 ARN 또는 invocation ID 를 그대로
# 사용한다.

model_list:
  # ── Claude Sonnet 4.6 (frontier, ACTIVE — global inference profile) ──
  # 2026-05-21 Phase E 검증 결과:
  # 1. Bedrock Seoul region 의 ACTIVE Sonnet/Haiku 는 on-demand 호출 미지원
  #    (inference profile 강제).
  # 2. APAC inference profile 은 LEGACY Sonnet 4 만 (30일 미사용 access denied).
  # 3. ACTIVE Sonnet 4.5 / 4.6 / Haiku 4.5 의 inference profile 은 모두
  #    `global.*` only — global cross-region routing.
  # 결정 (사용자 reanchor 2026-05-21): 사내 한정 + 비-개인정보 SQL 작업 가정으로
  # global routing 수용. 데이터 잔류 정책은 PIPA 엄격 적용 시 별 cycle 의
  # Provisioned throughput 또는 별 provider 로 재검토. ADR-0022 보강 필요.
  # Extended thinking: effort=high 수준 (budget_tokens=16000). thinking 활성화 시
  # temperature 는 LiteLLM 내부에서 1로 고정 (Anthropic 요구사항).
  - model_name: claude-sonnet-4
    litellm_params:
      # ── 개발 단계 (2026-06-23): claude-corp OAuth 계정(masangsoft.com)으로 Anthropic
      #    direct 호출. ANTHROPIC_API_KEY 에 OAuth access token 주입 → litellm 이
      #    sk-ant-oat 토큰을 감지해 Authorization: Bearer + oauth-2025-04-20 로 전송.
      #    배포 시 아래 Bedrock 2줄(model/aws_region_name)로 주석 토글 복구. ──
      model: anthropic/claude-sonnet-4-6
      # model: bedrock/global.anthropic.claude-sonnet-4-6   # 배포용 (Bedrock)
      # aws_region_name: ap-northeast-2                       # 배포용 (Bedrock)
      thinking:
        type: "enabled"
        budget_tokens: 16000

  # ── Claude Haiku 4.5 (가성비, ACTIVE — global inference profile) ─────
  # Extended thinking 활성화 (budget_tokens=5000). Haiku 4.5 는 Claude 4 시리즈로
  # extended thinking 을 지원한다. thinking 활성화 시 temperature 는 1로 고정.
  - model_name: claude-haiku-4
    litellm_params:
      # 개발 단계 (2026-06-23): claude-corp OAuth → Anthropic direct. 배포 시 Bedrock 복구.
      model: anthropic/claude-haiku-4-5
      # model: bedrock/global.anthropic.claude-haiku-4-5-20251001-v1:0   # 배포용 (Bedrock)
      # aws_region_name: ap-northeast-2                                   # 배포용 (Bedrock)
      thinking:
        type: "enabled"
        budget_tokens: 5000

  # ── KB 임베딩 alias `titan-embed` (1024-dim) — TASK-0135 (#13) ────────
  # texts.embedding(vector(1024)) + sample_queries.embedding(vector(1024)) 백필
  # + `<=>` cosine 검색용. kb_embedding_worker / kb_retrieval 이 본 alias 로
  # /v1/embeddings 호출 → LiteLLM 이 아래 provider 로 라우팅.
  # AGENT_KB_EMBEDDING_MODEL=titan-embed, AGENT_KB_EMBEDDING_DIM=1024 (.env).
  #
  # ── 현행 (2026-06-23): 로컬 Ollama bge-m3 (1024-dim) ──────────────────
  # "전환"으로 chat 은 Anthropic-direct(OAuth)로 이동했으나 Anthropic API 는
  # 임베딩 미제공 → titan-embed 만 Bedrock 에 남아 AWS 키 제거 후 401(credential
  # 부재)로 실패. 이를 Bedrock 의존 없이 로컬 Ollama bge-m3 로 대체한다.
  #   - bge-m3 = BAAI 다국어 임베딩, F16, embedding length 1024 (한국어 포함
  #     실측 dim=1024, 2026-06-23 ollama show + /api/embeddings probe 확인).
  #   - LiteLLM ollama provider 는 `model: ollama/<name>` + `api_base` 로 Ollama
  #     HTTP (/api/embeddings) 를 직접 호출한다. local-llm-gateway 는 chat 전용
  #     라우터라 /v1/embeddings 404 → gateway 우회하고 Ollama 백엔드 직접 지정.
  #   - api_base 의 ollama-edge:11434 는 `llm-shared` 네트워크 내 local-llm-edge
  #     컨테이너 alias. bedrock-gateway 가 도달하려면 docker-compose.yml 에서
  #     bedrock-gateway 서비스가 llm-shared 에 attach 돼 있어야 한다(본 cycle 에서
  #     `networks: [dbnet, llm-shared]` 로 추가).
  - model_name: titan-embed
    litellm_params:
      model: ollama/bge-m3
      api_base: http://ollama-edge:11434
  # ── 배포 복구용 (Bedrock Titan v2, Seoul) — AWS_* 자격 확보 후 위 3줄과 토글 ──
  # amazon.titan-embed-text-v2:0 는 Seoul region 접근 가능 확인(2026-06-02 boto3
  # probe, dim=1024). Bedrock 자격(AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY)을
  # 컨테이너 env 로 복구하면 아래 2줄로 되돌린다(차원 동일 1024 — 백필 호환).
  # - model_name: titan-embed
  #   litellm_params:
  #     model: bedrock/amazon.titan-embed-text-v2:0
  #     aws_region_name: ap-northeast-2

# ── 인증 ──────────────────────────────────────────────────────────────
# backend 가 보내는 Authorization 헤더의 Bearer token 을 BEDROCK_GATEWAY_API_KEY
# 와 대조. 일치 안 하면 401. AWS 자격증명은 컨테이너 env (AWS_ACCESS_KEY_ID /
# AWS_SECRET_ACCESS_KEY / AWS_REGION) 로만 주입되며 본 파일에 평문 미보관.
general_settings:
  master_key: os.environ/BEDROCK_GATEWAY_API_KEY

# ── 동작 ──────────────────────────────────────────────────────────────
# - drop_params: OpenAI Chat Completions 의 일부 파라미터 (예: `presence_penalty`,
#   `logit_bias`) 는 Bedrock Claude 가 지원하지 않으므로 LiteLLM 가 silently
#   drop. 본 코드 베이스의 `_openai_chat_completion_with_deadline` 호출이
#   `temperature` 만 추가하므로 drop 대상 거의 없음.
# - request_timeout: 본 backend 의 `AGENT_TIMEOUT_SEC` 와 정합. 사용자 turn 응답
#   timeout 보다 짧게 잡지 않는다.
litellm_settings:
  drop_params: true
  request_timeout: 120

# ── 모니터링 (옵션) ───────────────────────────────────────────────────
# LiteLLM 의 success/failure callback hook 으로 audit 확장 가능. 본 cycle 에서는
# stdout 로깅만 사용하고 audit row 의 token usage 누적은 후속 cycle.
# litellm_settings:
#   success_callback: ["log"]
#   failure_callback: ["log"]
