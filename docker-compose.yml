# 무제한 docker json-file 로그 누적 차단. 기본 driver 는 rotation 이 없어 장기
# 실행 시 컨테이너 로그가 수 GB 까지 자라 디스크/페이지캐시를 잠식한다(예: postgres·
# pgbouncer json 로그가 ~90MB/6h). 모든 서비스가 *default-logging 으로 상한.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-agent-common: &agent-common
  # 장기 실행 데몬의 누수/스레드 폭주가 호스트(특히 WSL2 vmmem)를 무한 잠식하지
  # 않도록 cgroup 상한. 현재 사용량(web ~96MB / insight ~122MB) 대비 넉넉한 headroom
  # 이라 정상 동작엔 무영향, runaway 만 차단. mem_limit 은 page cache 까지 cgroup 에
  # 귀속시켜 WSL2 VM 팽창 억제에도 기여한다.
  logging: *default-logging
  mem_limit: 1g
  pids_limit: 512
  build:
    context: .
    dockerfile: unit/feature-0002-agent-core/src/Dockerfile
    # TASK-0126 (#5 split-brain): 빌드 시 HEAD SHA 각인 (Makefile 이 export GIT_COMMIT).
    args:
      GIT_COMMIT: "${GIT_COMMIT:-unknown}"
  # CHG-20260522-0005 (feature-0007 follow-up): secret 영역별 env 분리. agent-
  # common 은 DB / KB / MinIO / LLM 자격증명을 모두 사용 (agent loop tool_use +
  # KB read + 첨부 read + LLM 호출). bedrock-gateway 의 AWS_* 는 본 chain 에
  # 포함 안 함 (least privilege).
  env_file:
    - .env
    - .env.mysql
    - .env.postgres
    - .env.minio
    - .env.llm
    # TASK-0205: datasource 자격증명 envelope 암호화 마스터 KEK (.env 분리 — least-privilege).
    # optional(required:false) — 미설정 환경은 datasource DB저장만 비활성(.env datasource 는 동작).
    - path: .env.secret
      required: false
    # TASK-20260619T034522-oauth-google-foundation: Google OAuth client 자격증명. web 의 OAuth 진입점
    # 전용이나 agent-common 공유 구조상 함께 inherit(agent/insight-worker 는 미사용 — 무해).
    # optional — 토대 기본 비활성(파일 부재 시 WEB_OAUTH_GOOGLE_ENABLED 미설정 → 엔드포인트 404).
    # web-only 분리는 후속(SECURITY.md §15.4 least-privilege 한계).
    - path: .env.oauth
      required: false
  environment:
    TZ: ${TZ}
    LANG: ${APP_LANG}
    LANGUAGE: ${APP_LANGUAGE}
    LC_ALL: ${APP_LC_ALL}
    PYTHONIOENCODING: utf-8
    # TASK-0130 (#5): 런타임/KB 정본이 PG 이므로 PG 장애 시 silent 빈-메모리 degradation
    # 대신 fail-loud. depends_on(postgres healthy) 과 함께 cold-boot 시 PG 미준비 상태로
    # ask 받는 것을 차단.
    AGENT_RUNTIME_PG_REQUIRED: "1"
    # feature-0025: insight-worker tick 배포값을 anchor 에 두어 web(설정 화면 baseline 표시)·워커가
    #   동일 기준값(60초)을 본다(관리 콘솔 '성능·병렬' 서브탭 baseline 정합). insight-worker 서비스가
    #   동일 값으로 명시 override 하며, 그 외 컨테이너는 이 값을 사용하지 않아 무해.
    AGENT_INSIGHT_WORKER_TICK_SEC: "60"
  volumes:
    - ../artifacts/shared:/shared
  depends_on:
    mysql:
      condition: service_healthy
    bedrock-gateway:
      condition: service_healthy
    # TASK-0130 (#5): 런타임(agent_runtime)·KB·첨부 정본이 PG/pgbouncer/minio 에 있는데
    # 이전엔 depends_on 에 없어 cold up 시 web 이 PG ready 전 ask 수신 → silent degradation.
    postgres:
      condition: service_healthy
    pgbouncer:
      condition: service_healthy
    # minio 는 첨부 전용(보조) — healthcheck 일시 실패가 web/agent boot 를 막지 않도록
    # service_started(존재만 보장)로 둔다. 런타임 정본 postgres/pgbouncer 만 healthy 강제.
    minio:
      condition: service_started

# feature-0045: 외부 AI 도구 표면 MCP 의 공통 정의. `ext-tool-mcp-a` / `ext-tool-mcp-b` 가
# 이것을 공유한다(web-a/web-b 와 같은 형태) — Caddy LB 뒤에서 한 번에 하나씩 교체하기 위해.
x-ext-mcp-common: &ext-mcp-common
  <<: *agent-common
  # feature-0045: `agent-common` 에는 restart 정책이 없다(워커는 배포가 관리한다). 그러나 이
  # 서비스는 **사용자 진입점**이고 2 replica 의 의미는 "한쪽이 죽어도 다른 쪽이 받는다" 이다 —
  # 죽은 쪽이 스스로 돌아오지 않으면 그 상태로 단일화되고, 다음 배포의 fail-closed 가드가
  # (정당하게) 롤아웃을 막는다. web replica 와 같은 정책을 준다.
  restart: unless-stopped
  environment:
    TZ: ${TZ}
    LANG: ${APP_LANG}
    PYTHONIOENCODING: utf-8
    # codex P2: 단일 replica 고정은 그 replica 의 롤링 재시작마다 MCP 를 끊는다.
    #   콤마 목록으로 주고 어댑터가 **연결 실패에만** 다음 후보로 넘어간다(HTTP 오류는 전달).
    EXT_TOOL_API_BASE_URL: ${EXT_TOOL_API_BASE_URL:-https://web-a:8000,https://web-b:8000}
    EXT_TOOL_UPSTREAM_TLS_SERVER_NAME: ${WEB_PUBLIC_HOST}
    EXT_TOOL_UPSTREAM_HOST_HEADER: ${WEB_PUBLIC_HOST}
    EXT_TOOL_CA_BUNDLE: /certs/rootCA.pem
    EXT_TOOL_HTTP_BIND: 0.0.0.0              # Caddy 가 도달해야 함
    EXT_TOOL_HTTP_ALLOW_PUBLIC_BIND: "1"     # 평문 수신 명시 동의 — TLS 는 Caddy 가 종단
    EXT_TOOL_HTTP_PORT: "8971"
    EXT_TOOL_TIMEOUT_SEC: "120"
    # feature-0045: replica 가 둘이 되는 순간 **세션 친화성**이 문제가 된다 — MCP
    # streamable-http 의 기본 모드는 세션 상태를 프로세스에 들고 있어서, 다음 요청이 다른
    # replica 로 가면 그 세션을 모른다. 이 표면은 매 호출이 Bearer 토큰으로 독립 인증되므로
    # 세션에 실을 상태가 없다 → stateless 로 띄워 replica 간 이동을 무해하게 만든다.
    EXT_TOOL_MCP_STATELESS: "${EXT_TOOL_MCP_STATELESS:-1}"
  # agent-common 의 volumes 를 덮어쓰므로 /shared 도 함께 적는다(빠지면 조용히 사라진다).
  volumes:
    - ../artifacts/shared:/shared
    - ../artifacts/certs:/certs:ro
  # codex P1: `<<: *agent-common` 만으로는 이 서비스가 네트워크에 붙지 않아 caddy·web 을
  #   해석하지 못한다(전 경로 502). dbnet 이 caddy·web 과 공유하는 망이다.
  networks: [dbnet]
  entrypoint: ["python", "-u",
               "/app/ext_tools/external_tool_mcp_http.py"]
  # codex P2: TCP 연결만 보면 upstream 이 죽어도 healthy 로 읽힌다. MCP 엔드포인트가 실제로
  #   HTTP 를 응답하는지까지 본다(GET 은 이 전송의 정상 메서드가 아니라 406 이 정상 응답).
  # codex P1(2차): **모든** HTTPError 를 성공으로 읽으면 경로 불일치(404)·SDK 내부 오류(5xx)가
  #   healthy 로 통과한다 — 바로 그 404 가 이번 cycle 의 실제 결함이었다. 허용 코드를 고정한다.
  #   (400/405 는 SDK 버전에 따른 같은 의미의 응답이라 함께 받는다.)
  healthcheck:
    test: ["CMD-SHELL", "python -c \"import urllib.request,urllib.error,sys;\nreq=urllib.request.Request('http://127.0.0.1:8971/api/ai/mcp');\ntry:\n    urllib.request.urlopen(req,timeout=5); sys.exit(0)\nexcept urllib.error.HTTPError as e:\n    sys.exit(0 if e.code in (400,405,406) else 1)\nexcept Exception:\n    sys.exit(1)\""]
    interval: 30s
    timeout: 10s
    retries: 5
    start_period: 20s
  # feature-0045: 15s → 130s. 이 프로세스는 개인 AI 의 요청을 web 으로 **중계 중**일 수 있고,
  # 그 왕복 상한이 `EXT_TOOL_TIMEOUT_SEC=120` 이다. 15s 로는 진행 중인 조사가 SIGKILL 로
  # 잘렸다 — 조용해지면 즉시 종료되므로 유휴 시 배포 시간에는 영향이 없다.
  stop_grace_period: 130s

# feature-0014 (P0b/P1): web 무중단 롤링 배포용 공통 정의. web-a/web-b 두 replica 가
# 동일 이미지/cert/healthcheck 로 떠서 Caddy LB 뒤에서 한 번에 하나씩 재시작된다.
# 시퀀스 merge `<<: [*web-extra, *agent-common]` — web-extra 가 먼저라 volumes(certs 포함)
# 등 겹치는 키는 web-extra 가 우선, 나머지(build/env_file/environment/depends_on 등)는
# agent-common 에서 채워진다. 프로덕션은 호스트 포트를 바인딩하지 않는다(Caddy :443 단일
# 진입, :18080 직접 문 폐기). 런타임 secret/datasource 설정(KEK·HOST_ALLOWLIST)은 agent-common
# 의 env_file(.env.secret)에서 주입되므로 base 파일셋만으로 완전하다(override 불요).
x-web-extra: &web-extra
  restart: unless-stopped
  # TASK-0297: ENABLE_WEB_TLS=1 + cert 존재 시 8000 에서 HTTPS, 아니면 평문. Caddy 가
  # 이 upstream 으로 HTTPS 연결(rootCA 검증, SNI=WEB_PUBLIC_HOST)한다.
  entrypoint: ["/bin/sh", "-c", "if [ -f \"$WEB_TLS_CERT_FILE\" ] && [ -f \"$WEB_TLS_KEY_FILE\" ] && [ \"$ENABLE_WEB_TLS\" = '1' ]; then exec uvicorn web.app:app --host 0.0.0.0 --port 8000 --ssl-keyfile \"$WEB_TLS_KEY_FILE\" --ssl-certfile \"$WEB_TLS_CERT_FILE\"; else exec uvicorn web.app:app --host 0.0.0.0 --port 8000; fi"]
  volumes:
    - ../artifacts/shared:/shared
    - ../artifacts/certs:/certs:ro
    - ../artifacts/deploy/ui-release:/srv/ui-release:ro
    # TASK-20260828T100000: 연결 지시문이 싣는 CA 지문은 **AI 가 실제로 내려받는 파일**
    # (`/trust/rootCA.crt` = 이 번들)에서 나와야 한다. `/certs/rootCA.pem` 으로 계산하면
    # CA 회전 후 `bin/trust-bundle.sh` 재조립이 누락된 순간 두 파일이 갈리고, 받는 쪽은
    # 정상 절차를 따랐는데 불일치를 보고 중단한다(온보딩이 통째로 막히는 오경보).
    - ../artifacts/trust-bundle:/srv/trust:ro
    # feature-0046 client-update-channel (2026-09-07): Windows 네이티브 클라이언트 설치기.
    #
    # ⚠ **이미지에 담을 수 없다.** 배포는 Linux 컨테이너에서 도는데 PyInstaller 는 실행 대상
    #   OS 에서만 그 OS 용 실행파일을 만든다 — 그래서 종전 `static/agent/DQAConnect.exe` 는
    #   라이브에서 영원히 없었고 「연결 프로그램 받기」는 계속 숨어 있었다(ROADMAP §10.2).
    #   저장소에 커밋하는 것도 답이 아니다(릴리스마다 수십 MB · 이미지 재빌드 없이는 못 내보냄).
    #
    # 반입은 `unit/feature-0046-native-client/src/scripts/publish_release.py` 하나이고,
    # 서버는 `routers/client_release.py` 가 **실물과 대조해 통과한 것만** 광고한다.
    #
    # ⚠ 디렉토리가 없으면 docker 가 **root 소유로 만든다** — 그러면 비-root 퍼블리시가
    #   막힌다. 처음 한 번은 배포 사용자가 먼저 만든다. **경로는 아래 마운트 원본과 같아야
    #   한다** — compose project dir 은 `repo/` 이고 `make deploy-web` 도 거기서 도므로,
    #   `mkdir -p artifacts/client-release` 를 그 cwd 에서 치면 **아무도 마운트하지 않는
    #   `repo/artifacts/client-release` 미끼**가 생기고 진짜 경로는 여전히 root 소유로 만들어진다:
    #     mkdir -p ../artifacts/client-release        # repo/ 에서
    #     mkdir -p <project_root>/artifacts/client-release   # cwd 무관하게 쓰려면
    - ../artifacts/client-release:/srv/client:ro
  networks: [dbnet, replica-net]
  # feature-0014: SIGTERM 시 uvicorn in-flight 비-SSE 요청 drain + @app.on_event(shutdown)
  # in-flight run 마킹(8s soft cap)에 여유. SSE 장수명 스트림은 deploy-web.sh pre-drain 게이트가 담당.
  stop_grace_period: 30s
  healthcheck:
    test: ["CMD", "python", "/app/scripts/healthcheck_web.py"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 40s

services:
  mysql:
    image: mysql:${MYSQL_IMAGE_TAG}
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 3g
    pids_limit: 512
    # CHG-20260522-0005: .env.mysql 별 파일 (MYSQL_ROOT_PASSWORD / DB_PASSWORD).
    env_file:
      - .env
      - .env.mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      TZ: ${TZ}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - ../artifacts/shared:/shared
      - ../artifacts/mysql-data:/var/lib/mysql
      - ../artifacts/mysql-backup:/shared/mysql-backup
      - ./unit/feature-0001-platform-runtime/src/mysql/conf.d/99-mysql-ai-server.cnf:/etc/mysql/conf.d/99-mysql-ai-server.cnf:ro
      - ./unit/feature-0001-platform-runtime/src/mysql/conf.d/99-mysql-ai-client.cnf:/etc/mysql/conf.d/99-mysql-ai-client.cnf:ro
    networks: [dbnet]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  # TASK-0015 §2.1.3 M0 (REQ-20260520-0001 / TASK-0017 cycle): KB Postgres pgvector
  # 마이그레이션의 1차 인프라. M0 단계에서는 standalone 서비스로 추가하여 기존 agent
  # 흐름에 무영향 (agent.depends_on 에는 M2 dual-write phase 부터 추가). M1 cycle 에서
  # `agent_kb_rw` / `agent_kb_ro` role 신설 + ADR-0021 작성. M3 cycle 에서 `vector(N)`
  # 컬럼 + `ivfflat` / `hnsw` index 활용.
  # T3-9: PostgreSQL 서버 파라미터 조정 (command 절). WAL 별도 볼륨 (postgres-wal)은
  #   신규 설치 시에만 적용 가능 (기존 data dir 내 pg_wal 은 이동 불가). 신규 설치 시
  #   PGDATA=/var/lib/postgresql/data, PGWALDIR=/var/lib/postgresql/wal 지정.
  # T3-8: 에이전트는 직접 postgres:5432 가 아닌 pgbouncer:5432 로 연결 권장.
  #   .env.postgres 에서 AGENT_KB_PG_HOST=pgbouncer 으로 변경하면 자동 전환.
  postgres:
    image: ${KB_PG_IMAGE:-pgvector/pgvector:pg16}
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 2g
    pids_limit: 512
    # CHG-20260522-0005: .env.postgres 별 파일 (AGENT_KB_PG_PASSWORD 외 role 별).
    env_file:
      - .env
      - .env.postgres
    environment:
      POSTGRES_DB: ${AGENT_KB_PG_DB:-agent_kb}
      POSTGRES_USER: ${AGENT_KB_PG_USER:-postgres}
      POSTGRES_PASSWORD: ${AGENT_KB_PG_PASSWORD:-change_me_pg}
      TZ: ${TZ}
    # T3-9: 서버 파라미터. Docker 환경 기준 (2–4 CPU, 2–4 GB RAM 가정).
    # shared_buffers=256MB: RAM 의 25% 목표. effective_cache_size=768MB: OS 페이지 캐시 포함.
    # wal_level=replica: T5-14 streaming replica 준비. max_wal_senders=3: replica 1개 + 여유.
    # shared_preload_libraries=pg_stat_statements: T3-10 슬로우 쿼리 추적.
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_buffers=16MB
      - -c
      - default_statistics_target=100
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - work_mem=4MB
      - -c
      - min_wal_size=512MB
      - -c
      - max_wal_size=2GB
      - -c
      # feature-0025 인프라 여력: pgbouncer DEFAULT_POOL_SIZE(40) + 워커 병렬도 fan-out 을 수용(100→150).
      - max_connections=150
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=3
      - -c
      - hot_standby=on
      - -c
      # feature-0016: cutover 시 KB_PG_PRELOAD=pg_stat_statements,age 로 AGE preload(롤백=env 제거).
      - shared_preload_libraries=${KB_PG_PRELOAD:-pg_stat_statements}
      - -c
      - pg_stat_statements.track=all
    ports:
      - "${AGENT_KB_PG_PORT:-5432}:5432"
    volumes:
      - ../artifacts/postgres-data:/var/lib/postgresql/data
      - ../artifacts/postgres-wal:/var/lib/postgresql/wal
      - ../artifacts/shared:/shared
    networks: [dbnet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-agent_kb}"]
      interval: 10s
      timeout: 5s
      retries: 20

  # T3-8: PgBouncer — transaction-mode connection pooler.
  # 에이전트가 call 마다 새 TCP connection 을 여는 비용을 제거 (_pg_connect 패턴).
  # 에이전트는 pgbouncer:5432 (dbnet 내부) 로 연결 → PgBouncer 가 postgres 에 재사용.
  # 활성화: .env.postgres 에 AGENT_KB_PG_HOST=pgbouncer 설정.
  # pool mode: transaction — short-lived query 에 최적. prepared statement 비활성화 필요.
  #   (psycopg3 에서는 prepare=False 또는 pipeline 비활성화로 호환 가능.)
  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    pids_limit: 128
    env_file:
      - .env.postgres
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${AGENT_KB_PG_USER:-postgres}
      DB_PASSWORD: ${AGENT_KB_PG_PASSWORD:-change_me_pg}
      DB_NAME: ${AGENT_KB_PG_DB:-agent_kb}
      POOL_MODE: transaction
      # feature-0025 인프라 여력: 워커 병렬도('답변 동시 처리 수' 등) 상향 시 서버측 커넥션 풀에 여유를 준다.
      #   ⚠ 2026-07-14 §82(풀 20 소진 → lock-wait → 전역 워커 장애) 재발 방지 — DEFAULT_POOL_SIZE(40) 는
      #   PG max_connections(150) 이하로 유지. 병렬 활성 시 실제 부하는 구조 conn(ask executor cx + 잡별
      #   heartbeat hb_conn + coordinator conn)뿐 아니라 run_agent 스텝마다의 memory/usage per-call 단명
      #   연결 + insight 병렬(node≤8·cluster≤4) usage 연결 + web inprocess ask 까지 합산되므로 "ask≤8×2"
      #   보다 크다. 단 이들은 autocommit·transaction-pooling 이라 서버 점유가 짧다. 또 DEFAULT_POOL_SIZE
      #   는 (user,db) 쌍당이라 role 다수면 40×N 서버 conn 가능 → 병렬도를 크게 올리기 전 라이브 실측 권장.
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "40"
      AUTH_TYPE: scram-sha-256
      # feature-0016: admin 콘솔(PAUSE/RESUME)을 DB_USER(agent_kb_rw, userlist 보유)로 허용.
      # bin/pg-restart.sh 가 PG primary 재시작/config 변경을 near-zero RW 단절로 수행하는 데 필요.
      # (edoburu 기본 admin_users=postgres 는 userlist 에 없어 인증 불가였음.) unix socket 부재 →
      # 컨테이너 내 psql 로 TCP admin 접속. 보안: agent_kb_rw 는 이미 신뢰 내부 role + pgbouncer 는
      # dbnet 전용. 전용 admin user 분리는 하드닝 후속.
      ADMIN_USERS: ${AGENT_KB_PG_USER:-postgres}
      TZ: ${TZ}
    ports:
      - "${AGENT_KB_PGB_PORT:-6432}:5432"
    networks: [dbnet]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U ${AGENT_KB_PG_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # T5-14: Postgres streaming replica (opt-in, profiles: [replica]).
  # 기동 전 1회 초기화 필요:
  #   docker compose run --rm postgres-replica-init
  # 그 후: docker compose --profile replica up -d postgres-replica
  # 에이전트 read-only 연결: .env.postgres 에 AGENT_KB_PG_HOST_RO=postgres-replica 설정.
  postgres-replica:
    image: ${KB_PG_IMAGE:-pgvector/pgvector:pg16}
    restart: unless-stopped
    profiles: [replica]
    logging: *default-logging
    mem_limit: 1g
    pids_limit: 512
    env_file:
      - .env.postgres
    environment:
      POSTGRES_DB: ${AGENT_KB_PG_DB:-agent_kb}
      POSTGRES_USER: ${AGENT_KB_PG_USER:-postgres}
      POSTGRES_PASSWORD: ${AGENT_KB_PG_PASSWORD:-change_me_pg}
      PGUSER: ${AGENT_KB_PG_USER:-postgres}
      PGPASSWORD: ${AGENT_KB_PG_PASSWORD:-change_me_pg}
      TZ: ${TZ}
    command:
      - postgres
      - -c
      - hot_standby=on
      - -c
      # feature-0025 인프라 여력: primary 와 정합(100→150). hot standby 는 primary max_connections 이상 필요.
      - max_connections=150
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      # feature-0016: replica 도 AGE preload 필요(RO 그래프 read). cutover 시 KB_PG_REPLICA_PRELOAD=age.
      - shared_preload_libraries=${KB_PG_REPLICA_PRELOAD:-}
    volumes:
      - ../artifacts/postgres-replica-data:/var/lib/postgresql/data
    networks: [dbnet]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-agent_kb}"]
      interval: 10s
      timeout: 5s
      retries: 20

  # T5-14: 1회성 replica 초기화 (pg_basebackup). 완료 후 컨테이너 종료.
  # 실행: docker compose run --rm postgres-replica-init
  postgres-replica-init:
    image: ${KB_PG_IMAGE:-pgvector/pgvector:pg16}
    restart: "no"
    profiles: [replica]
    logging: *default-logging
    env_file:
      - .env.postgres
    environment:
      PGPASSWORD: ${AGENT_KB_PG_PASSWORD:-change_me_pg}
      TZ: ${TZ}
    entrypoint:
      - "bash"
      - "-c"
      - >-
        rm -rf /replica-data/* &&
        pg_basebackup -h postgres -p 5432
        -U agent_kb_rw -D /replica-data -Xs -P -R &&
        echo 'pg_basebackup done. run: docker compose --profile replica up -d postgres-replica'
    volumes:
      - ../artifacts/postgres-replica-data:/replica-data
    networks: [dbnet]
    depends_on:
      postgres:
        condition: service_healthy

  agent:
    <<: *agent-common
    networks: [dbnet, replica-net]

  memory-init:
    <<: *agent-common
    entrypoint: ["python", "/app/agent_core.py", "--init-memory"]
    networks: [dbnet]
    restart: "no"
    # TASK-0019 (M2-a) outside-voice REV-20260520-0007 Critical: postgres race
    # condition mitigation. `agent_core.py:init_memory()` 가 `_pg_available()` true
    # 시 `_ensure_pg_schema()` 호출 — postgres 컨테이너 가 healthy 되기 전 호출
    # 시 OperationalError. mysql 외 postgres 도 service_healthy 까지 wait.
    # postgres 미가동 환경 (compose 에 postgres 서비스 없음) 에서는 본 depends_on
    # 도 silent skip (compose 가 미정의 서비스는 무시).
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
        required: false

  # ── 외부 AI 도구 표면 MCP (HTTP/SSE 전송, feature-0041) ──────────────────────
  # 외부 AI 가 런처 설치 없이 **URL + 토큰만 등록**해 붙게 하는 경로. Caddy 가
  # `/api/ai/mcp*` 를 여기로 넘긴다(같은 호스트·같은 인증서 — 접근 편의 최대화).
  #
  # web 컨테이너에 **얹지 않고 별도 프로세스**로 둔 이유: FastMCP 는 자체 세션/백그라운드
  # 상태를 갖는 서드파티 ASGI 앱이라, 라이브 대화를 서빙하는 web 안에 마운트하면 그 결함이
  # 곧 전면 장애가 된다. 여기서 죽어도 web 은 무영향이다(Caddy 가 이 경로만 502).
  #
  # 토큰은 **보관하지 않는다** — 클라이언트 Authorization 헤더를 upstream 으로 그대로 넘긴다.
  #
  # ⚠ upstream 은 평문이 아니다. `ENABLE_WEB_TLS=1` 이면 web replica 가 8000 에서 **TLS 로**
  #   듣고, 인증서 SAN 은 공개 호스트뿐이라 `web-a` 이름으로는 호스트명 검증이 실패한다.
  #   Caddy 가 쓰는 해법을 그대로 쓴다 — 검증을 끄는 게 아니라 **검증 대상 이름을 고정**한다
  #   (`tls_server_name` + `header_up Host` ↔ EXT_TOOL_UPSTREAM_TLS_SERVER_NAME/HOST_HEADER).
  #   `ENABLE_WEB_TLS=0` 환경이라면 EXT_TOOL_API_BASE_URL 을 http:// 로 두고
  #   EXT_TOOL_ALLOW_PLAINTEXT_UPSTREAM=1 을 주면 된다.
  # feature-0045 (브리지 배포 연속성): 단일 컨테이너였던 MCP 표면을 **2 replica** 로 나눈다.
  # 개인 AI 는 여기에 붙어 있는데, 배포마다 이 컨테이너가 통째로 recreate 되면 그 연결이
  # 끊겼다(surge 도 드레인도 없었고 stop_grace 는 15s 였다). web-a/web-b 와 같은 구조를 주면
  # Caddy 뒤에서 한 번에 하나씩 교체할 수 있어 항상 ≥1 후보가 남는다. 상시 컨테이너가 1개
  # 늘지만, 그 대가로 "배포하면 AI 연결이 끊긴다" 가 사라진다.
  ext-tool-mcp-a:
    <<: *ext-mcp-common
  ext-tool-mcp-b:
    <<: *ext-mcp-common

  insight-worker:
    <<: *agent-common
    environment:
      TZ: ${TZ}
      LANG: ${APP_LANG}
      LANGUAGE: ${APP_LANGUAGE}
      LC_ALL: ${APP_LC_ALL}
      PYTHONIOENCODING: utf-8
      AGENT_SESSION: insight_worker
      AGENT_CONVERSATION_ID: __insight_worker__
      # TASK-0130: environment override 시 anchor 의 PG_REQUIRED 가 상속 안 되므로 명시.
      AGENT_RUNTIME_PG_REQUIRED: "1"
      # 장애 datasource가 있을 때 짧은 tick과 자동 재시도가 연결 폭주로
      # 번지지 않도록 worker와 health probe의 재시도 예산을 분리한다.
      AGENT_DISABLE_AUTO_RETRY: "1"
      AGENT_INSIGHT_WORKER_TICK_SEC: "60"
      AGENT_INSIGHT_WORKER_DEGRADED_BACKOFF_SEC: "900"
      AGENT_CONN_HEALTHY_RECHECK_SEC: "120"
      AGENT_CONN_UNSTABLE_RECHECK_SEC: "60"
      AGENT_CONN_UNSTABLE_RECHECK_MAX_SEC: "900"
      AGENT_CONN_PROBE_WORKERS: "1"
      # feature-0016 §55 (REQ-20260706 ②·④): Phase B 크로스-데이터소스 추론 flip — ADR-019 의
      # "임베딩 populate 후 flip" 이행. §55 D(시그니처 백필 미처리-우선 fix)가 populate 를 가동하므로
      # 데몬을 켠다(임베딩 없는 동안은 후보 0 = 자연 no-op, cadence 6h). intra-DS 크로스 스키마
      # (AGENT_XSCHEMA_RELATIONSHIP_INFER_AUTO)는 config 기본 ON — 별도 지정 불요.
      AGENT_XDS_RELATIONSHIP_INFER_AUTO: "1"
    entrypoint: ["python", "/app/agent_core.py", "--insight-worker"]
    networks: [dbnet, replica-net]
    restart: on-failure:3
    # feature-0015: SIGTERM graceful(_INSIGHT_SHUTDOWN) — 진행 cycle 을 루프 경계에서 마치고 종료.
    # cycle 이 LLM 호출로 길 수 있어 기본 10s 보다 여유. 초과 시 SIGKILL 이나 쓰기 멱등이라 무손상.
    stop_grace_period: 30s
    # TASK-0130 (#4): heartbeat 신선도 기반 healthcheck. advisory-lock 버그로 매 사이클
    # skip_locked 라 24h+ 무동작이어도 Docker 가 healthy 로 표기하던 것을 가시화.
    healthcheck:
      test: ["CMD", "python", "/app/scripts/healthcheck_insight_worker.py"]
      interval: 60s
      # feature-0020: 10s → 30s. probe 가 DB 연결을 여는 스크립트라 호스트 부하 시 10s 를
      # 초과해 timeout 오탐(라이브 16h unhealthy 실측, 2026-07-14). 배포 스파인의 워커
      # healthy 게이트가 이 상태를 신뢰하므로 오탐이 곧 배포 false-fail — 여유 상향.
      timeout: 30s
      retries: 3
      start_period: 60s

  # TASK-0169: out-of-process ask 실행 워커 (DESIGN-ask-worker.md / ADR-WEB-0004 B).
  # ask_jobs 큐에서 claim 해 run_agent 를 실행 → web 재배포/SIGTERM 이 in-flight run 을
  # 죽이지 않는다. web 은 AGENT_ASK_EXECUTION_MODE=worker 일 때만 enqueue 한다(기본
  # inprocess 라 이 서비스가 떠 있어도 그 자체로는 동작 변경 없음 — shadow 안전).
  ask-worker:
    <<: *agent-common
    environment:
      TZ: ${TZ}
      LANG: ${APP_LANG}
      LANGUAGE: ${APP_LANGUAGE}
      LC_ALL: ${APP_LC_ALL}
      PYTHONIOENCODING: utf-8
      AGENT_SESSION: ask_worker
      AGENT_CONVERSATION_ID: __ask_worker__
      # anchor 의 PG_REQUIRED 가 environment override 시 상속 안 되므로 명시(TASK-0130 패턴).
      AGENT_RUNTIME_PG_REQUIRED: "1"
      AGENT_ASK_WORKER_ENABLED: "1"
      # feature-0020 surge drain: SIGTERM 후 **진행 중 run 을 끝까지 완주**시키는 예산.
      # 종전 60s 는 실측 run 의 66%(p50 81s · p95 691s · max 2,024s)를 커버하지 못해 매 배포가
      # 진행 중 답변을 재큐시켰다(= 사용자에겐 처음부터 다시). surge 가 신규 job 을 받는 동안
      # 본체는 자기 job 만 마치면 되므로, 이 예산을 늘리는 데 드는 사용자 비용이 0 이 됐다.
      AGENT_ASK_WORKER_DRAIN_SEC: "${AGENT_ASK_WORKER_DRAIN_SEC:-1800}"
    entrypoint: ["python", "/app/agent_core.py", "--ask-worker"]
    networks: [dbnet, replica-net]
    restart: unless-stopped
    # SIGTERM 후 현재 실행 중 run 이 **완주**할 시간(drain 예산 + 반납 여유). 종전 70s 는
    # "한 step 예산" 기준이었고 그것이 곧 배포마다 run 을 죽이던 창이다(feature-0020).
    # 정상 경로는 완주 즉시 프로세스가 스스로 종료하므로 이 값이 배포 시간을 늘리지 않는다 —
    # hang 된 워커의 안전 상한일 뿐이다. 배포 스파인은 자체 stop timeout 으로 별도 제어한다.
    stop_grace_period: 1830s
    healthcheck:
      test: ["CMD", "python", "/app/scripts/healthcheck_ask_worker.py"]
      interval: 30s
      # feature-0020: 10s → 30s (insight-worker 와 동일 근거 — 부하 시 timeout 오탐 억제).
      timeout: 30s
      retries: 3
      start_period: 40s

  # ── ask-worker 배포 surge replica (feature-0020 zd-ask-rollout) ───────────────
  # 목적: **바쁜 시간대에도 배포가 완결되게** 한다. 종전엔 본체를 교체하기 전에 전역 quiesce
  # (진행 중 사용자 run 이 시스템 전체에서 0)를 기다렸는데, 실측 유입(7~10분 간격)과 run 길이
  # (p95 691s) 조합에서 낮 시간대에는 상한 900s 안에 그런 정적 창이 생기지 않는다. 그래서
  # ask-worker 가 영구 미배포로 남고, 순차 롤아웃이라 그 **뒤 워커들까지 연쇄로** 구버전에
  # 묶였다(2026-08-14 라이브 실측 — 본 서비스 도입 계기).
  #
  # gateway surge 와 결정적으로 다른 점: ask-worker 는 HTTP 소켓이 아니라 **PG 큐 소비자**다.
  # 신규 job 은 소켓이 아니라 `ask_jobs` 에서 오고, claim 은 `FOR UPDATE SKIP LOCKED` +
  # lease_epoch fencing 이라 다중 인스턴스가 exactly-once 로 안전하다(이미 `_ask_conc` 로
  # 스레드 다중화를 하는 것과 같은 계약). 따라서 "신규는 surge 가 받고, 본체는 자기 in-flight
  # 만 완주" 가 성립하고 — gateway 에선 불가능한 — **전역 정적 대기 자체가 불필요해진다**.
  #
  # 평시엔 기동하지 않는다(profile deploy-surge — steady-state 리소스 증가 0).
  # DNS alias 가 필요 없다(큐에서 스스로 pull 한다). role prefix 는 본체와 같아야 role-scoped
  # 고아 회수가 계속 성립하고, 서로를 뺏지 않는 근거는 heartbeat 신선도다(살아 있는 형제는
  # `reclaim_role_orphan_jobs` 의 self/heartbeat 술어에서 제외된다).
  ask-worker-surge:
    <<: *agent-common
    profiles: ["deploy-surge"]
    environment:
      TZ: ${TZ}
      LANG: ${APP_LANG}
      LANGUAGE: ${APP_LANGUAGE}
      LC_ALL: ${APP_LC_ALL}
      PYTHONIOENCODING: utf-8
      AGENT_SESSION: ask_worker
      AGENT_CONVERSATION_ID: __ask_worker__
      AGENT_RUNTIME_PG_REQUIRED: "1"
      AGENT_ASK_WORKER_ENABLED: "1"
      AGENT_ASK_WORKER_DRAIN_SEC: "${AGENT_ASK_WORKER_DRAIN_SEC:-1800}"
    entrypoint: ["python", "/app/agent_core.py", "--ask-worker"]
    networks: [dbnet, replica-net]
    # 배포 스파인이 생성·정리를 소유한다. 재시작 정책이 있으면 정리 실패 시 유령이 남는다.
    restart: "no"
    # 본체와 **대칭** — surge 는 본체가 healthy 해진 뒤 stop 되는데, 그 시점 surge 가 들고 있는
    # run 은 교체 창에 들어온 것들이다. 여기만 짧게 두면 본체 쪽 구멍을 막고 surge 쪽에 같은
    # 구멍을 남기는 셈이다(gateway surge 가 330s 대칭을 택한 것과 같은 근거).
    stop_grace_period: 1830s
    healthcheck:
      test: ["CMD", "python", "/app/scripts/healthcheck_ask_worker.py"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 40s

  # feature-0039: 운영 정기 잡 인-컨테이너 스케줄러.
  #
  # 이전엔 호스트 **root crontab** 이 `cd <repo> && bin/{backup,restore-rehearsal,
  # metadata-graph-sync}.sh` 를 돌렸다. root 였던 유일한 근거는 그 래퍼들이 `docker exec`
  # 를 쓰는데 이 호스트의 docker 소켓 접근이 root 에만 있었기 때문이다. 잡을 서비스
  # 안으로 옮기면 docker 소켓 의존이 사라져 root 권한 근거 자체가 소멸한다.
  # (docker 소켓을 컨테이너에 마운트하는 반대 방향은 컨테이너→호스트 root 승격 경로라
  # 채택하지 않았다 — docs/SECURITY.md 및 feature-0039 REVIEW.md 참조.)
  ops-scheduler:
    <<: *agent-common
    environment:
      TZ: ${TZ}
      LANG: ${APP_LANG}
      LANGUAGE: ${APP_LANGUAGE}
      LC_ALL: ${APP_LC_ALL}
      PYTHONIOENCODING: utf-8
      AGENT_SESSION: ops_scheduler
      AGENT_CONVERSATION_ID: __ops_scheduler__
      # anchor 의 PG_REQUIRED 는 environment override 시 상속 안 되므로 명시(TASK-0130 패턴).
      AGENT_RUNTIME_PG_REQUIRED: "1"
      # 스케줄은 호스트 crontab 시절 값을 그대로 승계한다(벽시계 동일 — 컨테이너 TZ=${TZ}).
      # 빈 문자열로 두면 해당 잡만 비활성, OPS_SCHED_ENABLED=0 이면 전체 비활성.
      OPS_SCHED_BACKUP: "0 3 * * *"
      OPS_SCHED_RESTORE_REHEARSAL: "30 3 * * 0"
      OPS_SCHED_GRAPH_INCREMENTAL: "*/30 * * * *"
      OPS_SCHED_GRAPH_FULL: "17 4 * * *"
      # SIGTERM 후 진행 중 잡을 기다리는 예산. stop_grace_period(300s) 보다 짧게 둬서
      # 스케줄러가 스스로 정리하고 내려갈 시간을 남긴다.
      OPS_SCHED_SHUTDOWN_GRACE_SEC: "280"
    entrypoint: ["python", "/app/scripts/ops_scheduler.py"]
    # dbnet 만 필요하다(postgres/mysql 직결). LLM·replica 망은 붙이지 않는다 — 최소 노출.
    networks: [dbnet]
    # agent-common 의 depends_on 은 **상속하지 않는다**. 백업·그래프 sync 는 LLM 게이트웨이나
    # MinIO 와 무관한데, 그것들이 unhealthy 이면 cold start 에서 스케줄러가 통째로 안 뜬다
    # (= 정기 잡 전면 정지). 실제로 필요한 두 DB 만 게이트한다.
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ../artifacts/shared:/shared
      # 백업 산출물·잡 로그를 호스트 cron 시절과 **동일 경로**에 남긴다
      # (컨테이너 /artifacts/... = 호스트 ../artifacts/... — 운영자 조회 경로 보존).
      # ⚠️ `../artifacts` 전체를 마운트하지 않는다 — 그 아래에 mysql-data·postgres-data·
      # postgres-replica-data·minio-data 라이브 데이터 디렉터리가 있어서, 스크립트 오류
      # (예: 보존정책 rm 의 glob 사고)가 곧 DB 파일 훼손이 된다. 잡이 실제로 쓰는 두
      # 디렉터리만 노출한다.
      - ../artifacts/backups:/artifacts/backups
      - ../artifacts/metadata-graph:/artifacts/metadata-graph
      # ⚠️ AGE 그래프 sync 의 flock 을 **호스트와 공유**하기 위한 마운트.
      # 2026-07-14 인시던트(feature-0016 §82)의 동시성 가드는 호스트에 남아 있는
      # bin/routine-backfill.sh 와 공유되어야 실효가 있다. flock 은 inode 단위라
      # 경로가 달라도 같은 파일이면 상호배제가 성립한다.
      - ${OPS_LOCK_DIR:-/root/.locks/mysql-ai-delegated-dev}:/opslocks
    restart: unless-stopped
    # 진행 중 잡(백업 덤프 ~2분)이 끝날 여유. deploy-web.sh 가 매 배포마다 서비스를
    # recreate 하므로 짧게 잡으면 하필 백업 중이던 배포가 그 회차를 통째로 날린다
    # (다음 주기까지 재시도 없음). 스케줄러가 이 예산 안에서 잡을 기다린 뒤 내려간다
    # (OPS_SCHED_SHUTDOWN_GRACE_SEC=50 기본 → 아래 값에 맞춰 상향). 잡이 없으면 즉시
    # 종료하므로 평시 배포 지연은 0.
    stop_grace_period: 300s
    healthcheck:
      test: ["CMD", "python", "/app/scripts/healthcheck_ops_scheduler.py"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s

  mcp:
    image: bytebase/dbhub:${DBHUB_IMAGE_TAG}
    restart: unless-stopped
    profiles: ["mcp"]
    logging: *default-logging
    mem_limit: 512m
    pids_limit: 256
    # CHG-20260522-0005: .env.mysql (DBHUB_DSN 의 DB_PASSWORD 치환용).
    env_file:
      - .env
      - .env.mysql
    environment:
      TZ: ${TZ}
      LANG: ${APP_LANG}
      LANGUAGE: ${APP_LANGUAGE}
      LC_ALL: ${APP_LC_ALL}
      DBHUB_LOG_LEVEL: ${DBHUB_LOG_LEVEL}
    ports:
      - "${MCP_HOST_PORT}:${MCP_PORT}"
    command:
      - --transport
      - ${MCP_TRANSPORT}
      - --host
      - 0.0.0.0
      - --port
      - "${MCP_PORT}"
      - --dsn
      - "${DBHUB_DSN}"
    networks: [dbnet]
    depends_on:
      mysql:
        condition: service_healthy

  # === Google Drive MCP (feature-0010, SCAFFOLD — 연동 미수행 / 기본 비활성) ============
  # TASK-20260623T190000-gdrive-foundation. profile 'gdrive' 미지정 시 기동 안 함(기본 배포 무영향).
  # 각 계정이 본인 Drive 에 연결하는 멀티테넌트 연동의 MCP 서버 자리표. 단일 자격증명 서버가
  # 아니라 per-account 토큰 주입(seam A)을 쓴다 — 정본:
  #   unit/feature-0010-google-drive-integration/docs/DECISIONS.md (ADR seam A)
  #   unit/feature-0010-google-drive-integration/src/gdrive_mcp_seam.py
  # 활성화는 operator opt-in(GDRIVE_MCP_IMAGE/GDRIVE_MCP_CMD 지정 + SECURITY.md §16 강화 TODO 충족).
  gdrive-mcp:
    image: ${GDRIVE_MCP_IMAGE:-alpine:3.20}
    profiles: ["gdrive"]
    restart: "no"
    logging: *default-logging
    mem_limit: 512m
    pids_limit: 256
    # env_file = .env(비-secret GDRIVE_MCP_* 만). seam(A)에서 MCP 서버는 client_secret 이 아니라
    # 계정별 user access_token 을 호출시 주입받으므로 .env.oauth(client_secret) 불필요(least-privilege).
    # 활성화 cycle 에서 서버가 client 자격증명을 요구하면 그때 `- path: .env.oauth`/`required: false` 추가.
    env_file:
      - .env
    environment:
      TZ: ${TZ}
      GDRIVE_MCP_ENABLED: ${GDRIVE_MCP_ENABLED:-0}
      GDRIVE_MCP_PORT: ${GDRIVE_MCP_PORT:-8090}
      GDRIVE_MCP_CMD: ${GDRIVE_MCP_CMD:-}
    # 토대 placeholder — GDRIVE_MCP_CMD 미지정 시 안내만 출력 후 종료(비상주). operator 가 실제
    # Drive MCP 서버 커맨드를 지정하면 bin/gdrive-mcp.sh 가 기동(런처 동형 경로).
    command:
      - /bin/sh
      - -c
      - "echo '[gdrive-mcp] SCAFFOLD (feature-0010 토대): GDRIVE_MCP_CMD 미지정 — 미기동. 활성화는 docs/DECISIONS.md(seam A) + bin/gdrive-mcp.sh 참조'; exit 0"
    networks: [dbnet]
    # 활성화 시(HTTP MCP): 에이전트가 GDRIVE_MCP_URL=http://gdrive-mcp:${GDRIVE_MCP_PORT} 로 접근.
    # 호스트 포트 노출(ports)은 사내망 한정 — 필요 시 operator 가 추가.

  # feature-0014 (Tier 2 무중단): web 을 두 replica 로 분할. Caddy LB(web-a:8000 web-b:8000)
  # 뒤에서 deploy-web.sh 가 한 번에 하나씩 재시작 → 항상 ≥1 healthy upstream. 두 replica 는
  # 동일 이미지(build-once)/cert/healthcheck 를 공유한다(x-web-extra). 호스트 포트 없음
  # (Caddy :443 단일 진입). 직접 디버그가 필요하면 dev override 에서 한 replica 에만 포트 부여.
  web-a:
    <<: [*web-extra, *agent-common]
  web-b:
    <<: [*web-extra, *agent-common]

  caddy:
    image: caddy:2
    restart: unless-stopped
    init: true
    logging: *default-logging
    mem_limit: 256m
    pids_limit: 256
    env_file:
      - .env
    environment:
      WEB_PUBLIC_HOST: ${WEB_PUBLIC_HOST}
      WEB_TLS_CERT_FILE: ${WEB_TLS_CERT_FILE}
      WEB_TLS_KEY_FILE: ${WEB_TLS_KEY_FILE}
    volumes:
      - ./unit/feature-0006-lan-proxy-access/src/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../artifacts/certs:/certs:ro
      # TASK-20260617T083954-ai-claude-trust-bundle: 테스터 Root CA 신뢰 설치 번들 (bin/trust-bundle.sh 가 조립). /trust/ 로 서빙.
      - ../artifacts/trust-bundle:/srv/trust:ro
      - ../artifacts/caddy-data:/data
      - ../artifacts/caddy-config:/config
    ports:
      - "${WEB_HTTP_PORT}:80"
      - "${WEB_HTTPS_PORT}:443"
    networks: [dbnet]
    depends_on:
      - web-a
      - web-b

  browser:
    build:
      context: .
      dockerfile: unit/feature-0004-browser-automation/src/Dockerfile
    restart: unless-stopped
    # Chromium/Playwright 은 장기 세션에서 메모리 누수가 흔하다 — 넉넉히 캡.
    logging: *default-logging
    mem_limit: 2g
    pids_limit: 1024
    env_file:
      - .env
    environment:
      BROWSER_SCREENSHOT_DIR: /shared/out/browser
    volumes:
      - ../artifacts/shared:/shared
    ports:
      - "${BROWSER_PORT}:8001"
    networks: [dbnet]

  # ── AWS Bedrock OpenAI-compatible gateway (feature-0007) ─────────────
  # LiteLLM proxy 가 `OpenAI(api_key, base_url)` 호출을 받아 AWS Bedrock 의
  # `bedrock-runtime:InvokeModel` 로 라우팅한다. AWS 자격증명은 본 컨테이너 env
  # 로만 주입되며, backend / frontend 는 BEDROCK_GATEWAY_API_KEY (gateway token)
  # 만 인지한다 (사용자 결정 5 항목 정합). 외부 expose 안 함 — dbnet 내부에서만
  # 접근 가능.
  bedrock-gateway:
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    logging: *default-logging
    # §58 후속(2026-07-08 장애): litellm 이 07-07 라우팅 config 확장 후 기동 풋프린트가 1g 를
    # 초과 — 재생성 시 무로그 SIGKILL(137) 재시작 루프(실측 111회, 3g 단독 기동 정상으로 OOM
    # 확정). 라이브는 docker update 2g 응급 복구 — 여기 영속화. (#625 가 서비스 자체 1g 정의를
    # x-default 상속으로 오판해 중복 키를 만들었던 것을 단일 정의로 정정 — compose parse 회귀.)
    mem_limit: 2g
    pids_limit: 256
    # CHG-20260522-0005: .env.bedrock (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
    # bedrock-gateway 전용 least privilege) + .env.llm (BEDROCK_GATEWAY_API_KEY
    # 인증 token).
    env_file:
      - .env
      - .env.bedrock
      - .env.llm
    environment:
      TZ: ${TZ}
    volumes:
      - ./unit/feature-0007-bedrock-llm-provider/src/config/litellm_config.yaml:/app/config.yaml:ro
    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "8080"
    # local-llm-decommission(2026-09-07, 사용자 결정 "로컬 LLM 미사용"): titan-embed
    # (→ 로컬 Ollama bge-m3) alias 와 그 백엔드 embed-ollama 를 제거했으므로 이 게이트웨이가
    # 로컬 Ollama 로 나갈 일이 없다 → 외부 네트워크 llm-shared attach 를 해제한다.
    # (llm-shared 는 본래 별도 local_llm 프로젝트의 local-llm-edge/gateway 에 닿기 위한
    #  공유 네트워크였고, 그 프로젝트는 같은 날 폐기됐다.)
    # dbnet(앱·DB)은 master_key 인증 트래픽(앱→gateway)용으로 유지.
    networks: [dbnet]
    # feature-0020: 재배포 시 in-flight LLM 호출 drain 여유(litellm=uvicorn 이 SIGTERM 에
    # graceful — 신규 수락 중단 + 진행 요청 완료). 기본 10s 면 장시간 LLM 호출이 SIGKILL.
    #
    # conv-audit FR-llm-transient-failure-kills-run (2026-08-12) — 120s → 330s.
    # 120s 는 실측 분포 **안쪽**이었다: 30일 대화 LLM 라운드 1,210건 중 **120초 초과 96건(7.9%)**
    # (p50 11.3s · p95 181.8s). 즉 배포가 게이트웨이를 recreate 할 때마다 진행 중이던 라운드의
    # 약 8%가 grace 만료 SIGKILL 로 죽었고, 앱은 그 예외로 run 을 통째로 폐기했다. 2026-08-12
    # 사고에서는 사용자가 7분 40초를 기다린 끝에 도구 10회 분량 조사가 전부 사라졌다
    # (구 컨테이너 SIGTERM 11:00:05 → SIGKILL 11:02:05 = 정확히 120s).
    # 330s = 현행 운영값 AGENT_TIMEOUT_SEC(300s) + 여유 30s — 연장 미승인 run 의 단일 호출은
    # 어차피 클라이언트가 300s 에 컷하므로 이 값이면 사실상 전부 drain 된다.
    # **정직한 한계(§18.8 패널 P1-3)**: `AGENT_TIMEOUT_SEC` 은 관리 콘솔에서 최대 3600s 까지
    # 올릴 수 있고, 사용자가 타임아웃 연장을 승인한 run 은 per-call 상한이 900s 다. 그 구간의
    # 호출은 **이 grace 로 덮이지 않는다** — grace 를 3600s 로 키우면 배포가 한 시간 멎을 수
    # 있어 오답이다. 덮이지 않는 구간은 앱 층 재시도가 backstop 이며, 운영값이 grace 를 넘기면
    # `bin/deploy-web.sh` 의 gateway reconcile 이 배포 때마다 경고한다(드리프트 표면화).
    # **배포 지연 비용은 조건부다**: uvicorn 은 in-flight 가 끝나는 즉시 종료하므로 한산할 때는
    # 종전과 같고, 긴 호출이 있을 때만 그만큼 기다린다. 그 대기 동안 신규 요청은 surge replica
    # 가 DNS alias 로 흡수하므로 사용자 무중단은 유지된다(아래 bedrock-gateway-surge 참조).
    # 이 값을 넘겨 죽는 호출(연장 승인 run 등)은 앱 층 일시 실패 재시도가 흡수한다
    # (shared/config.py AGENT_LLM_TRANSIENT_RETRY_* — 두 층이 함께여야 봉인이 닫힌다).
    # cc-body-timeout(2026-08-26): gateway request_timeout 이 960s 로 올라가(연장 승인
    #   per-call 900s 보존) 330s 로는 교체 창에 걸린 연장 호출이 SIGKILL 된다. ceiling 보다
    #   크게(990s) 두어 drain 이 상류 상한을 덮게 한다 — 대신 gateway 교체가 최대 ~16분
    #   대기할 수 있다(사용자 결정 2026-08-26: 연장 호출 보존 우선).
    stop_grace_period: 990s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health/liveliness',timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ── bedrock-gateway 배포 surge replica (feature-0020) ─────────────────────────
  # 목적: 단일 gateway 재배포(이미지/설정 변경) 창의 LLM 요청 실패(SPOF)를 없앤다.
  # 평시엔 기동하지 않는다(profile deploy-surge — steady-state 메모리 비용 0). 배포
  # 스파인(deploy-web.sh deploy_gateway_reconcile)이 드리프트 감지 시에만:
  #   surge up → healthy → 본체 recreate → healthy → surge graceful stop·rm.
  # network alias 로 DNS 이름 `bedrock-gateway` 에 합류하므로(양 네트워크), 본체가
  # 재시작되는 동안 앱(BEDROCK_GATEWAY_URL=http://bedrock-gateway:8080)의 신규 요청은
  # surge 로 해석되고, 끊긴 연결은 OpenAI SDK 기본 connect-retry 가 흡수한다.
  # 상시 2-replica(HA)는 범위 밖 — 메모리 예산 결정 필요(unit ANCHOR §2 Alt-B).
  bedrock-gateway-surge:
    profiles: ["deploy-surge"]
    image: ghcr.io/berriai/litellm:main-stable
    restart: "no"
    logging: *default-logging
    mem_limit: 2g
    pids_limit: 256
    env_file:
      - .env
      - .env.bedrock
      - .env.llm
    environment:
      TZ: ${TZ}
    volumes:
      - ./unit/feature-0007-bedrock-llm-provider/src/config/litellm_config.yaml:/app/config.yaml:ro
    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "8080"
    # conv-audit FR-llm-transient-failure-kills-run: 본체와 **대칭**으로 330s. surge 는 본체가
    # healthy 해진 뒤 stop 되는데, 그 시점에도 surge 에 붙은 in-flight LLM 호출이 남아 있을 수
    # 있다(교체 창에 들어온 요청이 곧 surge 로 갔으므로 오히려 젊은 요청들이다). 여기만 120s 로
    # 두면 본체 쪽 구멍을 막고 surge 쪽에 같은 구멍을 남기는 셈이다.
    # cc-body-timeout(2026-08-26): gateway request_timeout 이 960s 로 올라가(연장 승인
    #   per-call 900s 보존) 330s 로는 교체 창에 걸린 연장 호출이 SIGKILL 된다. ceiling 보다
    #   크게(990s) 두어 drain 이 상류 상한을 덮게 한다 — 대신 gateway 교체가 최대 ~16분
    #   대기할 수 있다(사용자 결정 2026-08-26: 연장 호출 보존 우선).
    stop_grace_period: 990s
    networks:
      dbnet:
        aliases: [bedrock-gateway]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health/liveliness',timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ── 전용 임베딩 Ollama (embed-ollama) — 제거됨 (2026-09-07) ────────────────────
  # local-llm-decommission: 사용자 결정 "로컬 LLM 은 더 이상 사용하지 않는다"(2026-09-07).
  # 본 서비스는 titan-embed(→ ollama/bge-m3) 의 백엔드였고, 그 alias 도 같은 cycle 에서
  # litellm_config.yaml 에서 제거했다. KB 검색은 kb_retrieval 의 기존 2-tier 경로에 따라
  # 쿼리 임베딩 미설정 시 pg_trgm 유사도로 fallback 하므로 기능이 끊기지 않고 강등된다.
  # 되돌리기: 이 블록과 volumes.embed_ollama_models, litellm_config.yaml 의 titan-embed
  #   alias 를 함께 복원한다. **docker 볼륨(repo_embed_ollama_models)은 삭제하지 않았으므로
  #   적재된 bge-m3 모델이 그대로 남아 있다** — 선언만 되살리면 재다운로드 없이 복구된다.


  # TASK-0094 (REQ-20260521-0001, Critical §12.3) Sprint 1 Phase 1 — ADR-0022
  # MinIO S3-compat 첨부 객체 스토리지. BRIEFING D1 사용자 직접 확정. 사내망
  # 다운로드는 signed URL (frontend 전용), 외부 LLM 송신은 server-side bytes
  # read 후 base64/files API 로 전달 (BRIEFING D13). minio-init 부트스트랩이
  # bucket idempotent 생성 + lifecycle policy (D6 delete_reason 별 retention) +
  # root credential 비활성화 + app 전용 key 생성. App key rotation 은 D20
  # dual-key rotation runbook 따름 (Sprint 1 Phase 4 ship 조건).
  minio:
    image: minio/minio:RELEASE.2024-12-13T22-19-12Z
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1g
    pids_limit: 256
    # CHG-20260522-0005: .env.minio 별 파일 (MINIO_ROOT_PASSWORD / app key/secret).
    env_file:
      - .env
      - .env.minio
    environment:
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-}
      TZ: ${TZ}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ../artifacts/minio-data:/data
    networks: [dbnet]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # TASK-0094 Sprint 1 Phase 1 — minio-init one-shot bootstrap.
  # ADR-0022 의 idempotent bucket 생성 + lifecycle policy + root credential
  # 비활성화 + app 전용 access key 생성. Container exit 0 후 종료. App key
  # rotation 은 D20 runbook 의 dual-valid window 별 cycle subtask 로 처리.
  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    restart: "no"
    logging: *default-logging
    # CHG-20260522-0005: .env.minio 별 파일 (root + app key/secret 부트스트랩).
    env_file:
      - .env
      - .env.minio
    environment:
      MINIO_BUCKET: ${MINIO_BUCKET:-agent-attachments}
      TZ: ${TZ}
    volumes:
      - ./unit/feature-0003-agent-web-ui/src/scripts/minio-init.sh:/usr/local/bin/minio-init.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/minio-init.sh"]
    networks: [dbnet]
    depends_on:
      minio:
        condition: service_healthy

networks:
  dbnet:
  replica-net:
    external: true
    name: ${REPLICA_NETWORK_NAME:-replica-net}
