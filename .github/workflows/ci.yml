name: CI

# TASK-0126 (#11): 머지 차단 게이트. PR→main 에서 pytest 단위 테스트 + ruff 린트 실행.
# ruff 는 대규모 레거시 정리(Task 9) 전까지 비차단(continue-on-error). pytest 는 차단.
# (브랜치 보호 규칙은 GitHub repo settings 에서 "CI / test" required 로 활성화.)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r unit/feature-0002-agent-core/src/requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff) — 초기 비차단
        continue-on-error: true
        run: ruff check unit/feature-0002-agent-core/src unit/feature-0003-agent-web-ui/src

      - name: Guard — no raw AgentMemory* write SQL in live KB/runtime callers (TASK-0127 #1)
        run: |
          # 2026-05-27 cutover 회귀 차단: 라이브 ask/insight write 경로(memory/knowledge/utils)에
          # DROP 된 MySQL AgentMemory* 테이블 대상 raw INSERT/UPDATE/DELETE 재출현 시 실패.
          # (kb_backend.py 의 MysqlKbBackend 방언 구현체와 admin-only kb_ingest.py 는 별도 정리 대상이라 제외.)
          if grep -rnE "(INSERT( IGNORE)? INTO|UPDATE|DELETE FROM)\s+\`?AgentMemory" \
               unit/feature-0002-agent-core/src/modules/memory.py \
               unit/feature-0002-agent-core/src/modules/knowledge.py \
               unit/feature-0002-agent-core/src/modules/utils.py; then
            echo "::error::raw AgentMemory* write SQL 재출현 (cutover 회귀) — PG 백엔드(_dual_write_kb / PgRuntimeBackend) 사용 필요"
            exit 1
          fi
          echo "OK: 라이브 write 경로에 raw AgentMemory* SQL 없음"

      - name: Migration gate — multi-head/번호중복/MAX_MIGRATION 정합 (parallel-work-structure ITEM-02)
        run: |
          # 병렬 브랜치의 동번호 마이그레이션(0036 실충돌 계열)을 머지 전에 정적 적발.
          # 라이브 DB 불필요 — versions/*.py revision 그래프 파싱만 (self-test 로 검사기 자체도 검증).
          bash bin/migrate-lint.sh --self-test
          bash bin/migrate-lint.sh --heads

      - name: Code-Navigation Map gate — ROUTEMAP drift + 앵커 resolvability (§21.11.7 순환 폐쇄)
        run: |
          # AI 작업 후 code-map 재정합의 substrate 게이트. verify-completion 은 비차단 post-commit
          # hook 이라 merge 를 못 막으므로(AGENTS.md §21.11.4), routers/·src 변경 PR 에서 blocking 실행.
          # gen-routemap: routers AST 재스캔 결과가 docs/ROUTEMAP.md 와 다르면 STALE(exit 3) → CI fail.
          # codenav-lint: CODE_NAVIGATION/CODE_TASKS 의 file:symbol·모듈·DI seam 앵커 미해결 시 exit 3.
          # 둘 다 라이브 DB/컨테이너 불요(순수 정적 스캔).
          python3 bin/gen-routemap.py --check
          bash bin/codenav-lint.sh

      - name: Unit tests (pytest)
        env:
          # PYTHONPATH 에 repo 루트(.) 포함 — app.py 가 import 하는 최상위 `shared` 패키지 해소.
          # (Makefile `test` 타깃의 컨테이너 PYTHONPATH `…:/work` 와 동일 의미. 누락 시 `No module
          #  named 'shared'` 로 feature-0003 테스트 일괄 collection 실패.)
          PYTHONPATH: unit/feature-0002-agent-core/src:unit/feature-0003-agent-web-ui/src:.
          DB_USER: root
          DB_PASSWORD: test
          AGENT_MEMORY_DB: agent_memory
        run: |
          # app.py 는 import 시점에 SESSION_DIR(기본 /shared/web_sessions).mkdir() 을 호출한다.
          # 컨테이너엔 /shared 볼륨이 있지만 bare-runner 엔 없어 PermissionError 가 난다.
          # 러너에 쓰기 가능한 /shared 를 만들어 컨테이너 레이아웃과 동형으로 맞춘다(CI 전용).
          sudo mkdir -p /shared && sudo chmod 777 /shared
          # 일부 테스트(예: test_share_redaction_invariant)는 컨테이너 `/app/web` 레이아웃을 가정해
          # `import web.app` 을 직접 호출한다. bare-runner 에선 repo 루트에 `web` 네임스페이스가 없어
          # collection 이 실패하므로, web → feature-0003 src 심링크로 컨테이너와 동형 경로를 만든다.
          ln -sfn unit/feature-0003-agent-web-ui/src web
          # feature-0020 (2026-08-14): 배포 스파인 테스트 디렉토리를 **실제로 실행**한다.
          # pytest.ini 의 testpaths 에는 feature-0014/0020 이 등재돼 있었지만, 이 스텝이 경로를
          # 명시하면 testpaths 는 무시된다 — 그래서 "무중단 불변식을 잠그는 테스트가 CI 에서
          # 한 번도 돈 적 없는" 상태였다(등재 주석이 경계한 바로 그 함정을, 등재 자체는 못 막았다).
          # feature-0023 도 같은 이유로 누락돼 있었다(Makefile `test` 에는 있고 CI 에는 없었다).
          #
          # 2026-09-01: 같은 누락이 **3개 더** 남아 있었다 — feature-0041·0043·0008. 셋 다
          # `Makefile` `test` 에는 등재돼 있는데 이 목록에만 없어서, 그 스위트들은 CI 에서 한 번도
          # 돈 적이 없다. 발견 경위: feature-0043 에 회귀 18건을 추가하고 나서야 "그 테스트가 CI
          # 에서 도는가" 를 확인했고, 돌지 않았다. 위 주석이 경계한 함정이 **주석이 있는 채로**
          # 세 번 더 반복된 셈이다.
          #
          # ⚠ 이 목록과 `Makefile` 의 `test` 타깃은 **같은 집합이어야 한다.** 한쪽에만 추가하면
          #   로컬은 green 인데 CI 는 그 축을 보지 않는 상태가 조용히 생긴다 — 지금까지 4번 그랬다.
          #   새 테스트 디렉토리를 만들면 **양쪽 모두** 등재한다.
          pytest -q unit/feature-0002-agent-core/tests unit/feature-0003-agent-web-ui/tests \
                    unit/feature-0023-conversation-api-access/tests \
                    unit/feature-0014-zero-downtime-deploy/tests \
                    unit/feature-0020-zd-deploy-all/tests \
                    unit/feature-0041-external-ai-tool-surface/tests \
                    unit/feature-0043-external-llm-bridge/tests \
                    unit/feature-0008-windows-browser-testing/tests \
                    unit/feature-0006-lan-proxy-access/tests
