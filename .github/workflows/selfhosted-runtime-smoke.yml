name: Self-hosted Runtime Smoke

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, ready_for_review]

jobs:
  selfhosted-runtime-smoke:
    name: selfhosted-runtime-smoke
    runs-on: [self-hosted, linux]
    timeout-minutes: 90
    concurrency:
      group: selfhosted-runtime-smoke-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      SESSION_TAG: ghpr_${{ github.event.pull_request.number }}
      # Image 이름을 워크스페이스 디렉토리와 분리해 Makefile 의 `repo-*`
      # 검증 (Makefile:77-80) 과 정합. self-hosted runner 의 workspace 가
      # `repo` 가 아니어도 image 는 `repo-agent` 등으로 안정 생성된다.
      COMPOSE_PROJECT_NAME: repo
      # docker-compose.yml 의 ${VAR} substitution warning 차단용 기본값.
      # `.env` 가 runner 에 provisioned 돼 있으면 그 값이 우선한다.
      MYSQL_IMAGE_TAG: "8.0"
      MYSQL_PORT: "3306"
      MYSQL_ROOT_PASSWORD: ci_smoke_root
      DB_NAME: ci_smoke
      TZ: Asia/Seoul
      APP_LANG: en_US.UTF-8
      APP_LANGUAGE: en_US:en
      APP_LC_ALL: C.UTF-8
      WEB_PUBLIC_HOST: localhost
      MCP_TRANSPORT: stdio
      MCP_PORT: "8765"
      MCP_HOST_PORT: "8765"
      DBHUB_IMAGE_TAG: latest
      DBHUB_LOG_LEVEL: info
      DBHUB_DSN: ""
    steps:
      - name: Checkout merge ref
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          fetch-depth: 0

      - name: Fetch base ref
        shell: bash
        run: git fetch --no-tags origin "$BASE_REF"

      - name: Classify changed files
        id: classify
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: ./.github/scripts/classify_changes.sh

      - name: Skip runtime smoke for docs-only PRs
        if: steps.classify.outputs.docs_only == 'true'
        shell: bash
        run: |
          echo "Docs-only PR: runtime smoke skipped by policy." >> "$GITHUB_STEP_SUMMARY"

      - name: Provision .env from runner-local source
        if: steps.classify.outputs.docs_only != 'true'
        shell: bash
        env:
          SMOKE_ENV_PATH: ${{ vars.SMOKE_ENV_PATH }}
        run: |
          # runner-local `.env` 우선, 없으면 .env.example 기본값으로 fallback.
          # 실제 LLM/DB 자격 증명은 runner 운영자가 SMOKE_ENV_PATH (default:
          # ~/.mysql_ai_smoke.env) 에 provision 한다. 자세한 절차는
          # docs/GITHUB_AUTOMATION.md "러너 셋업" 참조.
          src="${SMOKE_ENV_PATH:-$HOME/.mysql_ai_smoke.env}"
          if [[ -f "$src" ]]; then
            cp "$src" .env
            echo "Provisioned .env from $src" >> "$GITHUB_STEP_SUMMARY"
          elif [[ -f .env.example ]]; then
            cp .env.example .env
            echo "WARN: runner-local .env not found at $src. Falling back to .env.example placeholders. \`make ask\` 등 LLM 의존 step 은 실패할 수 있다." >> "$GITHUB_STEP_SUMMARY"
          else
            echo ".env.example 도 없음. 워크플로 env 블록 기본값에만 의존." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Runtime smoke test
        if: steps.classify.outputs.docs_only != 'true'
        shell: bash
        run: |
          make start
          make status
          make ask q="현재 DB 목록 보여줘"
          make web
          make browser-up
          make browser-health
          if [[ "${ENABLE_MCP:-0}" == "1" ]]; then
            make mcp-test
          fi

      - name: Stop stack
        if: always() && steps.classify.outputs.docs_only != 'true'
        shell: bash
        run: |
          make browser-down >/dev/null 2>&1 || true
          make stop >/dev/null 2>&1 || true
