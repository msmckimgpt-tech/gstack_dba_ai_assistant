name: Owner Agent Report

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, ready_for_review]

jobs:
  owner-agent-report:
    name: owner-agent-report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      DEFAULT_PROVIDER: ${{ vars.AI_PROVIDER_DEFAULT }}
    steps:
      - name: Checkout merge ref
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          fetch-depth: 0

      - name: Fetch base ref
        shell: bash
        run: git fetch --no-tags origin "$BASE_REF"

      - name: Resolve provider
        id: provider
        shell: bash
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: ./.github/scripts/resolve_provider.sh

      - name: Classify changed files
        id: classify
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: ./.github/scripts/classify_changes.sh

      - name: Publish owner summary
        shell: bash
        run: |
          {
            echo "## Owner agent report"
            echo
            echo "- provider: ${{ steps.provider.outputs.provider }}"
            echo "- provider label: ${{ steps.provider.outputs.provider_label }}"
            echo "- docs only: ${{ steps.classify.outputs.docs_only }}"
            echo "- risk manual: ${{ steps.classify.outputs.risk_manual }}"
          } >> "$GITHUB_STEP_SUMMARY"
